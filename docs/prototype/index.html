<title>Top Ten</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Laurel — specs/design.md, with the layout and motion discipline inherited
   from Stack's design system (see specs/design.md amendments).
   Two rules this file follows without exception:
     · one left edge — every block starts at --margin, rails bleed right only
     · one spacing scale — sections are --s8 apart, always
   ─────────────────────────────────────────────────────────────────────────── */
:root {
  --bg-base: #FAF8F4;
  --bg-surface: #FFFFFF;
  --bg-recessed: #F1EDE6;
  --border-subtle: #E4DED3;
  --text-primary: #1C1A17;
  --text-secondary: #6E675D;
  --text-disabled: #A8A196;
  --accent: #8A6D1F;
  --accent-bright: #C9A227;
  --accent-muted: #EFE6CC;
  /* status.locked, design.md. It had no value here, so `background:
     var(--locked)` resolved to nothing and every locked badge rendered as an
     empty box — the gate's own object was invisible. */
  --locked: #8B8578;
  --error: #B3402E;
  --vault-bg: #121110;
  --vault-text: #F4F1EA;

  --serif: "New York", ui-serif, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;

  /* 4pt scale — design.md. Nothing gets a bespoke gap. */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px;
  --margin: 20px;
  --r-card: 10px; --r-sheet: 16px; --r-art: 6px;
  /* Ten minis plus nine gaps must fit the screen. The count is the product,
     and a slot you have to scroll to reach is not visible. */
  --mini-w: clamp(24px, calc((100vw - (var(--margin) * 2) - 54px) / 10), 40px);

  /* Motion tokens. Never type a duration inline — that is how four surfaces
     drift into four feels (Stack law). */
  --m-press: 120ms;
  --m-travel: 380ms;
  --m-ring: 480ms;
  --m-glimmer: 760ms;
  --m-retreat: 340ms;
  --m-settle: 260ms;
  --ease-out: cubic-bezier(.2,.8,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-base: #121110; --bg-surface: #1C1A18; --bg-recessed: #0C0B0A;
    --border-subtle: #2E2B27; --text-primary: #F4F1EA; --text-secondary: #A79F92;
    --text-disabled: #6E675D; --accent: #D9B23A; --accent-bright: #D9B23A;
    --accent-muted: #3A311A; --locked: #6E675D;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg-base); color: var(--text-primary);
  font: 15px/1.35 var(--sans); -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; }
ol, ul { list-style: none; margin: 0; padding: 0; }

.wrap {
  max-width: 560px; margin-inline: auto;
  padding: calc(env(safe-area-inset-top) + var(--s4)) var(--margin)
           calc(var(--dock-h, 168px) + var(--s8)) var(--margin);
}

.display-lg { font-family: var(--serif); font-weight: 600; font-size: 1.875rem; line-height: 1.16; letter-spacing: -0.015em; margin: 0; }
.section-h { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); margin: 0; }
.prompt { color: var(--text-secondary); margin: var(--s2) 0 0; }

/* ── Sections: one rule for the gap between every major block ───────────── */
section { margin-top: var(--s8); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); min-height: 24px; }
.section-head .more { color: var(--accent); font-size: 0.8125rem; font-weight: 600; white-space: nowrap; padding: var(--s2) 0 var(--s2) var(--s2); }

.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
.topbar .link { color: var(--accent); font-size: 0.8125rem; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; padding-left: var(--s3); }

/* ── Search ─────────────────────────────────────────────────────────────── */
.search { display: flex; align-items: center; gap: var(--s2); background: var(--bg-recessed); border: 1px solid var(--border-subtle); border-radius: var(--r-card); padding: 0 var(--s3); margin-top: var(--s6); }
.search svg { flex: 0 0 18px; color: var(--text-disabled); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 13px 0; font-size: 16px; color: var(--text-primary); }
.search input::placeholder { color: var(--text-disabled); }
.search .clear { flex: 0 0 44px; height: 44px; display: grid; place-items: center; color: var(--text-disabled); font-size: 1.125rem; }

/* ── Filter chips ───────────────────────────────────────────────────────── */
.chips { display: flex; gap: var(--s2); overflow-x: auto; margin: var(--s3) calc(var(--margin) * -1) 0; padding: 0 var(--margin) var(--s1); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 var(--s3); border-radius: 999px; border: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 0.8125rem; font-weight: 600; background: var(--bg-surface); }
.chip[aria-pressed="true"], .chip.on { background: var(--accent-muted); border-color: var(--accent); color: var(--accent); }
.chip .x { font-size: 1rem; line-height: 1; opacity: .7; }

/* ── Rails and cards ────────────────────────────────────────────────────── */
/* scroll-padding is load-bearing, not a nicety: scroll-snap aligns a card to
   the SCROLLPORT edge, which ignores the rail's own left padding, so the rail
   silently scrolled itself 20px on load and the first card sat half off the
   screen — the ragged left edge reported 2026-08-14. */
.rail { display: flex; gap: var(--s3); overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-left: var(--margin); margin: 0 calc(var(--margin) * -1); padding: 0 var(--margin) var(--s2); scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }

.card { position: relative; flex: 0 0 120px; scroll-snap-align: start; text-align: left; }
.card .art { position: relative; width: 120px; height: 180px; border-radius: var(--r-art); overflow: hidden; background: var(--bg-recessed); display: block; }
.card .art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--m-press) ease-out; }
.card:active .art img { transform: scale(0.97); }
.card .ring { position: absolute; inset: 0; pointer-events: none; }
.card .ring rect { fill: none; stroke-width: 3; }
.card .t { font-weight: 600; font-size: 0.8125rem; line-height: 1.25; margin-top: var(--s2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
/* A reason you can act on. "Also Nolan" now narrows to Nolan rather than
   just explaining itself (Mischa, round 2). */
.card .why { margin-top: 4px; }
.card .why .static { display: inline-block; font-size: 0.6875rem; line-height: 1.2; color: var(--text-secondary); border: 1px solid var(--border-subtle); border-radius: 999px; padding: 5px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .why button { font-size: 0.6875rem; line-height: 1.2; color: var(--accent); border: 1px solid var(--accent-muted); background: var(--accent-muted); border-radius: 999px; padding: 4px 8px; min-height: 28px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Two named controls per card. A bare chevron was a guess the user had to
   make (Mischa, round 2: "I didn't know how to add something to the 10 list
   vs what the chevron would do"), so both actions say what they do. */
/* Stacked, not side by side. Two labelled pills do not fit across a 120pt
   card, and a row that only just fits at the default text size is a row that
   breaks at the accessibility sizes this app has to pass. */
.card .acts { display: flex; flex-direction: column; gap: 6px; margin-top: var(--s2); }
.card .acts button { width: 100%; min-height: 34px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; }
.card .acts .do-add { background: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .card .acts .do-add { color: #17140B; } }
.card[data-in="1"] .acts .do-add { background: var(--accent-muted); color: var(--accent); }
.card .acts .do-similar { border: 1px solid var(--border-subtle); color: var(--text-secondary); }
.card .in { position: absolute; left: 6px; top: 6px; width: 26px; height: 26px; border-radius: 999px; background: var(--accent-bright); color: #17140B; font-size: 0.75rem; font-weight: 800; display: grid; place-items: center; opacity: 0; transform: scale(.6); transition: opacity var(--m-settle) var(--ease-out), transform var(--m-settle) var(--ease-out); }
.card[data-in="1"] .in { opacity: 1; transform: none; }

/* ── Search results / list rows ─────────────────────────────────────────── */
.row { display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left; padding: var(--s2) 0; border-bottom: 1px solid var(--border-subtle); min-height: 76px; }
.row .thumb { position: relative; flex: 0 0 40px; width: 40px; height: 60px; border-radius: 4px; overflow: hidden; background: var(--bg-recessed); }
.row .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row .meta { flex: 1; min-width: 0; }
.row .meta .t { display: block; font-weight: 600; font-size: 1rem; line-height: 1.25; }
.row .meta .s { display: block; color: var(--text-secondary); font-size: 0.8125rem; margin-top: 3px; }
.row .add { flex: 0 0 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; border: 1px solid var(--border-subtle); color: var(--accent); font-size: 1.25rem; }
.row[data-in="1"] .add { background: var(--accent-muted); border-color: var(--accent); }

.empty { color: var(--text-secondary); padding: var(--s4) 0; }

/* ── "Now showing" — one line that always answers what am I looking at ────
   Every clause of the current query is a chip you can drop, and the count is
   the proof it did something. */
.showing { margin-top: var(--s4); }
.showing .lead { font-size: 0.75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); }
.showing .clauses { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.showing .clause { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 999px; background: var(--accent-muted); color: var(--accent); font-size: 0.8125rem; font-weight: 600; border: 1px solid var(--accent); }
.showing .clause .x { opacity: .75; font-size: 0.9375rem; }
.showing .count { color: var(--text-secondary); font-size: 0.8125rem; }
.deadend { margin-top: var(--s3); color: var(--text-secondary); font-size: 0.875rem; }
.deadend p { margin: 0 0 var(--s2); }
.escapes { display: flex; flex-wrap: wrap; gap: 6px; }
.escape { min-height: 40px; padding: 0 var(--s3); border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; font-size: 0.8125rem; }
.showing .mapbtn { margin-left: auto; color: var(--accent); font-weight: 700; font-size: 0.8125rem; min-height: 32px; display: inline-flex; align-items: center; gap: 4px; }

/* The branch trail — where following one film led. Each step is walkable,
   because a path you can only read is a path you are stuck at the end of. */
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: var(--s3); color: var(--text-disabled); font-size: 0.8125rem; }
.trail > span:first-child { text-transform: uppercase; letter-spacing: .04em; font-weight: 700; font-size: 0.6875rem; }
.trail button { color: var(--accent); font-weight: 600; min-height: 32px; }
.trail button:last-of-type { color: var(--text-secondary); }

/* ── The dock: ten slots, always visible ────────────────────────────────── */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg-surface) 84%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--border-subtle);
  padding: var(--s3) 0 calc(env(safe-area-inset-bottom) + var(--s3)); }
@media (prefers-reduced-transparency: reduce) { .dock { background: var(--bg-surface); backdrop-filter: none; -webkit-backdrop-filter: none; } }
.dock-in { max-width: 560px; margin-inline: auto; }
.dock-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 0 var(--margin); }
.dock-top .n { font-family: var(--serif); font-weight: 700; font-size: 1.0625rem; }
.dock-top .hint { color: var(--text-secondary); font-size: 0.8125rem; margin-top: 1px; }
.dock-top .n.over { color: var(--error); }
.slots { display: flex; gap: 6px; justify-content: flex-start; overflow-x: auto; padding: var(--s3) var(--margin) 0; scrollbar-width: none; }
.slots::-webkit-scrollbar { display: none; }
.slotmini { position: relative; flex: 0 0 var(--mini-w); width: var(--mini-w); height: calc(var(--mini-w) * 1.5); border-radius: 4px; background: var(--bg-recessed); border: 1px solid var(--border-subtle); overflow: hidden; display: grid; place-items: center; }
.slotmini img { width: 100%; height: 100%; object-fit: cover; }
.slotmini .gh { font-family: var(--serif); font-weight: 700; color: var(--text-disabled); font-size: 0.875rem; }
.slotmini.one { box-shadow: inset 0 0 0 2px var(--accent-bright); }
.slotmini.landing { animation: land var(--m-settle) var(--ease-out); }
@keyframes land { 0% { transform: scale(.82); } 60% { transform: scale(1.04); } 100% { transform: none; } }

.btn { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 var(--s4); min-height: 48px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9375rem; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .btn { color: #17140B; } }
.btn[disabled] { background: var(--bg-recessed); color: var(--text-disabled); }
.btn.ghost { background: none; color: var(--accent); border: 1px solid var(--border-subtle); }

/* ── Sheets ─────────────────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10,9,8,.42); opacity: 0; transition: opacity var(--m-settle) ease; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg-surface);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0; max-height: 86vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform var(--m-settle) var(--ease-out); }
.sheet.on { transform: none; }
.sheet-in { overflow-y: auto; padding: var(--s4) var(--margin) calc(env(safe-area-inset-bottom) + var(--s4)); max-width: 560px; margin-inline: auto; width: 100%; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
.sheet-head h2 { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; margin: 0; }
.sheet-head .done { color: var(--accent); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }

/* Reorderable Ten */
.tenrow { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; border-bottom: 1px solid var(--border-subtle); }
.tenrow .num { font-family: var(--serif); font-weight: 700; font-size: 1.375rem; min-width: 1.4em; text-align: right; color: var(--text-primary); }
.tenrow.one .num { color: var(--accent-bright); font-size: 1.75rem; }
.tenrow .thumb { flex: 0 0 40px; width: 40px; height: 60px; border-radius: 4px; overflow: hidden; background: var(--bg-recessed); }
.tenrow .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tenrow .meta { flex: 1; min-width: 0; }
.tenrow .meta .t { display: block; font-weight: 600; line-height: 1.25; }
.tenrow .meta .s { display: block; color: var(--text-secondary); font-size: 0.8125rem; margin-top: 2px; }
.tenrow .mv { display: flex; flex-direction: column; }
.tenrow .mv button { width: 44px; height: 32px; display: grid; place-items: center; color: var(--accent); }
.tenrow .mv button[disabled] { color: var(--text-disabled); }
.tenrow .rm { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text-disabled); font-size: 1.25rem; }

/* Flying poster for the add hand-off */
.flier { position: fixed; z-index: 60; border-radius: var(--r-art); overflow: hidden; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.28); }
.flier img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ── Reveal ─────────────────────────────────────────────────────────────── */
.vault { position: fixed; inset: 0; z-index: 50; background: var(--vault-bg); color: var(--vault-text); display: grid; place-items: center; padding: var(--s6); opacity: 0; transition: opacity 420ms ease; }
.vault.in { opacity: 1; }
.vault .stage { text-align: center; max-width: 340px; width: 100%; }
.badge-wrap { width: min(72vw, 260px); margin: 0 auto; aspect-ratio: 1; }
.badge-wrap svg { width: 100%; height: 100%; display: block; }
.layer { opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity 460ms ease, transform 460ms var(--ease-out); }
.layer.on { opacity: 1; transform: none; }
#l-plate:not(.on) { transform: scale(0.86); }
#l-motif:not(.on) { transform: scale(0.7); }
#l-metal:not(.on) { transform: scale(1.04); }
.inscription { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; margin-top: var(--s6); min-height: 1.6em; }
.inscription .ch { opacity: 0; }
.inscription .ch.on { opacity: 1; transition: opacity 90ms linear; }
.vault .skip { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 18px; color: #A79F92; font-size: 0.875rem; min-height: 44px; padding: 0 var(--s2); opacity: 0; transition: opacity 300ms ease; }
.vault .skip.on { opacity: 1; }
.vault .after { opacity: 0; transition: opacity 400ms ease; margin-top: var(--s6); display: flex; gap: var(--s2); justify-content: center; }
.vault .after.on { opacity: 1; }
.vault .after .btn.ghost { color: var(--accent-bright); border-color: #33302B; }

@media (prefers-reduced-motion: reduce) {
  .layer, .inscription .ch, .vault, .vault .after, .vault .skip, .sheet, .scrim, .slotmini { transition-duration: 1ms !important; animation: none !important; }
  #l-plate, #l-motif, #l-metal { transform: none; }
}

/* ── Finished ───────────────────────────────────────────────────────────── */
.badge-inline { width: 128px; margin: 0 auto var(--s2); }
.badge-inline svg { width: 100%; display: block; }
.finished-head { text-align: center; }
.finished-head .insc { font-family: var(--serif); font-weight: 600; font-size: 1.0625rem; margin-top: var(--s2); }
.sug-topic { display: block; width: 100%; text-align: left; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-card); padding: var(--s3) var(--s4); margin-bottom: var(--s2); }
.sug-topic .t { font-family: var(--serif); font-weight: 600; font-size: 1.0625rem; }
.sug-topic .lvl { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; color: var(--text-disabled); margin-bottom: var(--s1); }
/* The card leads with the LIST NAME (Mischa, 2026-08-15). The name is the
   only display-size type on the card; the topic sits above it as a label and
   the creator below it as a byline, both far smaller — a card is a list first
   and a person second. Nothing on it is free text. */
.other-ten { position: relative; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-card); padding: var(--s4); margin-bottom: var(--s3); }
.other-ten .topic { display: block; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-disabled); }
.other-ten .listname { font-family: var(--serif); font-weight: 600; font-size: 1.375rem; line-height: 1.18; letter-spacing: -0.012em; margin: var(--s1) 0 0; }
.other-ten .creator { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-top: var(--s1); }
.other-ten .strip { display: flex; gap: 4px; margin: var(--s3) 0 0; }
.other-ten .mini { position: relative; width: 40px; height: 60px; border-radius: 4px; overflow: hidden; flex: 0 0 40px; background: var(--bg-recessed); }
.other-ten .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.other-ten .mini b { position: absolute; left: 0; bottom: 0; font-family: var(--serif); font-size: 0.625rem; background: rgba(18,17,16,.72); color: #F4F1EA; padding: 0 4px; border-radius: 0 4px 0 4px; }
/* The gate, stated: what the badge is, and the one thing that opens it. It is
   a status, never a second verb competing with the card's action. */
.other-ten .badgecell { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--border-subtle); }
.other-ten .badgecell svg { width: 44px; height: 44px; flex: 0 0 44px; }
.other-ten .badgecell .lockedbadge { flex: 0 0 44px; }
.other-ten .badgecell .state { display: block; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); }
.other-ten .badgecell.open .state { color: var(--accent); }
.other-ten .badgecell .how { display: block; font-size: 0.8125rem; color: var(--text-secondary); margin-top: 2px; }
/* One action per card, full width, 48pt tall, saying what it does. It was a
   line of grey text floating in the middle of the card. */
.other-ten .cta { display: flex; width: 100%; min-height: 48px; align-items: center; justify-content: center;
  margin-top: var(--s4); padding: var(--s2) var(--s4); border-radius: 999px;
  border: 1.5px solid var(--accent); background: var(--bg-surface); color: var(--accent);
  font-weight: 600; font-size: 0.9375rem; text-align: center;
  transition: transform var(--m-press) var(--ease-out); }
.other-ten .cta:active { transform: scale(.985); }
/* The gate-crossing action on a person's page: the same 48pt pill, and never
   welded to the sentence above it. */
.gate-cta { margin-top: var(--s4); }
/* The locked badge: the badge's plate in status.locked, wearing a lock. It
   was a circle over a bar, which at 44pt reads as an avatar — the one thing it
   must not be mistaken for on a screen full of other people. */
.lockedbadge { width: 44px; height: 44px; display: block; }
.lockedbadge .plate { fill: var(--locked); opacity: .22; }
.lockedbadge .shackle { stroke: var(--locked); fill: none; stroke-width: 3; stroke-linecap: round; opacity: .75; }
.lockedbadge .body { fill: var(--locked); opacity: .75; }
.lockedbadge.big { width: 128px; height: 128px; margin: 0 auto; }
.tenrow.shared { box-shadow: inset 0 0 0 1px var(--accent-muted); border-radius: var(--r-card); }
.sug-topic .why { font-style: italic; font-size: 0.875rem; color: var(--text-secondary); margin-top: 2px; }

/* ── Duel (optional ranking help) ───────────────────────────────────────── */
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-top: var(--s6); }
.duel button { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-sheet); padding: var(--s3); text-align: center; }
.duel img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: var(--r-art); display: block; }
.duel .t { font-weight: 600; font-size: 0.9375rem; margin-top: var(--s2); line-height: 1.2; }
.progress { display: flex; gap: var(--s1); margin-top: var(--s4); }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-recessed); }
.progress i.on { background: var(--accent); }

/* ── The Cut ────────────────────────────────────────────────────────────── */
.cut-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-top: var(--s4); }
.cut-cell { position: relative; border-radius: var(--r-art); overflow: hidden; aspect-ratio: 2/3; background: var(--bg-recessed); }
.cut-cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity var(--m-settle) ease, transform var(--m-settle) ease; }
.cut-cell:not([data-keep="1"]) img { opacity: .34; transform: scale(.97); }
.cut-cell[data-keep="1"]::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent-bright); border-radius: var(--r-art); }
.cut-cell .kn { position: absolute; left: 6px; top: 6px; width: 24px; height: 24px; border-radius: 999px; background: var(--accent-bright); color: #17140B; font-size: .75rem; font-weight: 700; display: grid; place-items: center; }
.cut-cell:not([data-keep="1"]) .kn { display: none; }

footer.notes { margin-top: var(--s8); padding-top: var(--s4); border-top: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 0.8125rem; }
footer.notes .build { color: var(--text-disabled); margin-top: var(--s2); }
/* ── Intro ────────────────────────────────────────────────────────────────
   Stack's splash rules, inherited wholesale: show the product rather than
   describe it, bake the artwork in so the first screen never waits on an API,
   answer "what will this cost me" before asking for anything, and no Skip —
   this screen only tells, so a Skip would be a second CTA competing with the
   real one. */
.intro { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; gap: var(--s4);
  padding: calc(env(safe-area-inset-top) + var(--s3)) 0 calc(env(safe-area-inset-bottom) + var(--s3)); }
.intro-copy { padding: 0 var(--margin); max-width: 560px; margin-inline: auto; width: 100%; }
.intro h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.75rem, 8vw, 2.25rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
.intro .pitch { font-size: 0.9375rem; line-height: 1.4; color: var(--text-secondary); margin: var(--s2) 0 0; max-width: 30em; }
.intro ul { margin: var(--s4) 0 0; display: grid; gap: var(--s2); }
.intro li { display: grid; grid-template-columns: 22px 1fr; gap: var(--s3); align-items: start; font-size: 0.8125rem; line-height: 1.3; }
.intro li b { font-weight: 700; }
.intro li .m { font-family: var(--serif); font-weight: 700; color: var(--accent-bright); text-align: center; line-height: 1.2; }
.intro .cta { padding: 0 var(--margin); max-width: 560px; margin-inline: auto; width: 100%; }
.intro .cta .btn { width: 100%; min-height: 54px; font-size: 1.0625rem; }

/* Two rows drifting in opposite directions. Each strip is rendered twice and
   translated by exactly one copy's width, so the wrap has no seam. */
.marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee + .marquee { margin-top: var(--s2); }
.marquee .strip { display: flex; gap: var(--s2); width: max-content; animation: drift 46s linear infinite; }
.marquee.back .strip { animation-direction: reverse; animation-duration: 58s; }
.marquee .tile { position: relative; width: 64px; height: 96px; border-radius: var(--r-art); overflow: hidden; background: var(--bg-recessed); flex: 0 0 64px; }
.marquee .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.marquee .tile .rank { position: absolute; left: 0; bottom: 0; width: 26px; height: 26px; display: grid; place-items: center;
  font-family: var(--serif); font-weight: 800; font-size: 0.9375rem; color: #17140B; background: var(--accent-bright); border-radius: 0 var(--r-art) 0 var(--r-art); }
@keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
@media (prefers-reduced-motion: reduce) { .marquee .strip { animation: none; } }

/* ── The map — the whole path you have explored, all at once ─────────────
   Round 2's headline: moving back in a branch used to erase everything ahead
   of it. The graph is now permanent; the map is how you see and re-enter it. */
.mapview { position: fixed; inset: 0; z-index: 45; background: var(--bg-base); display: flex; flex-direction: column; }
.map-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: calc(env(safe-area-inset-top) + var(--s4)) var(--margin) var(--s3); }
.map-head h2 { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; margin: 0; }
.map-head .done { color: var(--accent); font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; }
/* The key. Each state carries a SHAPE as well as a colour, because in the
   vault theme --accent and --accent-bright are the same gold: a key that told
   "you are here" from "in your Ten" by colour alone would tell them apart for
   nobody, in either theme, and the quality gate says AA and not colour-only. */
.map-key { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); padding: 0 var(--margin) var(--s3); }
.map-key li { display: inline-flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: 0.8125rem; }
.map-key svg { display: block; flex: 0 0 auto; }
.key-plate { fill: var(--bg-surface); stroke: var(--border-subtle); stroke-width: 1.5; }
/* The block that stands for artwork. .75 rather than a lighter wash because
   it is the whole difference between "path you took" and "not explored yet",
   and WCAG 1.4.11 wants 3:1 for a graphic that carries meaning — it measures
   3.1:1 on gallery paper and 4.6:1 in the vault. */
.key-art { fill: var(--text-secondary); opacity: .75; }
.key-here .key-plate { stroke: var(--accent); stroke-width: 2.5; }
.key-ten .key-plate { stroke: var(--accent-bright); stroke-width: 2.5; }
.key-next .key-plate { fill: var(--bg-recessed); stroke: var(--text-secondary); stroke-dasharray: 3 2.5; }
.key-check { fill: none; stroke: #17140B; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.map-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 0 var(--margin) calc(env(safe-area-inset-bottom) + var(--s6)); }
.map-node { cursor: pointer; }
.map-node .plate { fill: var(--bg-surface); stroke: var(--border-subtle); stroke-width: 1; }
.map-node.focus .plate { stroke: var(--accent); stroke-width: 2.5; }
.map-node.picked .plate { stroke: var(--accent-bright); stroke-width: 2.5; }
.map-node text { font-family: var(--sans); font-size: 9px; fill: var(--text-secondary); }
.map-node.focus text { fill: var(--text-primary); font-weight: 700; }
.map-edge { fill: none; stroke: var(--border-subtle); stroke-width: 2; }
.map-tick, .key-tick { fill: var(--accent-bright); }
/* "You are here" is a caret above the plate, not a coloured ring — the ring
   it used to rely on is the same gold as a pick in the vault theme. */
.map-here, .key-here-mark { fill: var(--accent); }
.map-context { padding: 0 var(--margin) var(--s3); color: var(--text-secondary); font-size: 0.8125rem; }
.map-context strong { color: var(--accent); }
/* A next step is NOT a selection, so it is not drawn like one: no artwork at
   all, a dashed empty well, and a + where the poster would be. The old
   treatment faded a real poster to 42%, which left four full-colour films
   hanging under the topic reading as four picks nobody made (2026-08-15). */
.map-node.ghost .plate { fill: var(--bg-recessed); stroke: var(--text-secondary); stroke-width: 1.5; stroke-dasharray: 4 3; }
.map-node.ghost text { fill: var(--text-secondary); font-style: italic; }
.map-plus, .key-plus { fill: none; stroke: var(--text-secondary); stroke-width: 2; stroke-linecap: round; }
.map-edge.ghost { stroke-dasharray: 4 4; opacity: .6; }

/* The empty state. Not an origin with speculative children — a designed page
   that says what the map is for and what puts something on it. */
.map-empty { padding: var(--s4) 0 0; color: var(--text-secondary); max-width: 34em; }
.map-empty .blank-art { display: block; margin: 0 0 var(--s6); fill: none; stroke: var(--text-disabled); stroke-width: 1.5; }
.map-empty h3 { font-family: var(--serif); font-weight: 600; font-size: 1.125rem; color: var(--text-primary); margin: 0 0 var(--s2); }
.map-empty p { margin: 0 0 var(--s4); }
.map-empty ul { display: grid; gap: var(--s3); margin: 0 0 var(--s4); }
.map-empty li { display: grid; grid-template-columns: auto 1fr; gap: var(--s3); align-items: baseline; }
.map-empty li .m { font-weight: 700; color: var(--accent); white-space: nowrap; }
.map-empty .hint { font-style: italic; margin: 0; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="dock"></div>
<div id="sheets"></div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="catalog.js"></script>
<script src="books.js"></script>
<script>
/* ===========================================================================
   Top Ten — flow prototype, build 0003.
   Rebuilt around Mischa's rounds (2026-08-14) and Stack's hard-won rules:
     · acting on a card must not make the card leave
     · a thing that moves must be seen travelling to where it went
     · one left edge, one spacing scale
     · a reason is shown only when there is one
   =========================================================================== */

const IMG = 'https://image.tmdb.org/t/p/';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app'), dockEl = $('#dock'), sheetsEl = $('#sheets'), live = $('#live');
/* Artwork, in one place. Films and shows are TMDB paths that only mean
   something concatenated onto TMDB's CDN; books are not on TMDB at all and
   carry their own URL in `img`. Every call site asks this instead of building
   a URL, so adding a domain whose pictures live somewhere else costs one
   helper rather than a dozen edits. */
const art = (f, size = 'w185') => f.img || `${IMG}${size}${f.p}`;
/* Books are a separate file from catalog.js on purpose: two builders that
   write the same bytes eventually write them at the same time. */
const CAT = [...(window.CATALOG || []), ...(window.CATALOG_BOOKS || [])];
const SERVICES = window.SERVICES || [];
const byId = new Map(CAT.map(f => [f.id, f]));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const announce = m => { live.textContent = m; };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const KEY = 'topten.proto.v4';
/* The domains, in the order Mischa set them (2026-08-15). Two are built; the
   rest are named rather than hidden, because a picker that shows only what
   exists tells the user the app is smaller than it is going to be — and a
   greyed row with a date is a promise, while an absent row is nothing. */
/* Each domain also names its own axes and says what one of its things is
   called, because the screen is the same screen and the words are not: a
   books shelf that offers a Director filter and counts its items in "films"
   is the film app wearing a hat. A null axis is one this domain does not
   have — a book has no cast and is not on Netflix — and its chip is not
   drawn rather than opening onto an empty sheet. */
const DOMAINS = [
  { id: 'movie', label: 'Movies', noun: 'movies', one: 'movie', ready: true,
    topic: { id: 'movies', domain: 'movie', title: 'Movies', prompt: 'Your 10 favorite movies of all time.' } },
  { id: 'tv', label: 'TV shows', noun: 'shows', one: 'show', ready: true,
    topic: { id: 'tv', domain: 'tv', title: 'TV shows', prompt: 'Your 10 favorite TV shows of all time.' } },
  // Books live in their own file, so this one domain can go missing on its
  // own. If it does, the row falls back to "coming next" rather than opening
  // an empty collection — a promise is a better failure than a blank screen.
  // A book has no streaming service and no cast, so those axes are absent
  // rather than empty: an axis with nothing behind it is a dead control.
  { id: 'book', label: 'Books', noun: 'books', one: 'book',
    ready: (window.CATALOG_BOOKS || []).length > 0,
    axes: { services: null, genre: 'Subject', director: 'Author', actor: null },
    sim: { rec: 'Often read together', with: 'Also by' },
    topic: { id: 'books', domain: 'book', title: 'Books', prompt: 'Your 10 favorite books of all time.' } },
  { id: 'games', label: 'Video games', noun: 'games', one: 'game', ready: false },
  { id: 'restaurants', label: 'Restaurants', noun: 'places', one: 'place', ready: false },
  { id: 'travel', label: 'Travel destinations', noun: 'places', one: 'place', ready: false },
];
const domainOf = t => (t && t.domain) || 'movie';
/* One vocabulary per domain, never a word hard-coded into a string both
   domains reach. A movie Ten says "movies", a TV Ten says "shows" — the
   catalog nouns are the only place either word is written down. US spelling
   throughout, per specs/design.md "Voice and spelling" (2026-08-15, Mischa). */
const domainMeta = (t = S.topic) => DOMAINS.find(d => d.id === domainOf(t)) || DOMAINS[0];
const nounFor = (t = S.topic) => domainMeta(t).noun;
const countNoun = (n, t = S.topic) => `${n} ${n === 1 ? domainMeta(t).one : domainMeta(t).noun}`;
const TOPIC_ALL = DOMAINS[0].topic;
const AXES = { services: 'Services', genre: 'Genre', director: 'Director', actor: 'Actor' };
const SIMWORDS = { rec: 'Often watched together', with: 'With' };
const domain = (t) => DOMAINS.find(d => d.id === domainOf(t || S.topic)) || DOMAINS[0];
const axes = () => ({ ...AXES, ...(domain().axes || {}) });
const simwords = () => ({ ...SIMWORDS, ...(domain().sim || {}) });
/* One of them, and ten of them. "0 books" and "1 book" are the same sentence
   with the same rule, so the rule lives here. */
const noun = (n, t) => n === 1 ? domain(t).noun.replace(/s$/, '') : domain(t).noun;
const shelfSize = () => CAT.filter(f => (f.dm || 'movie') === domainOf(S.topic)).length;

/* Region decides which subscriptions are on offer. Guessed, never asked —
   a question at the door costs more than a wrong guess you can change. */
function guessRegion() {
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Honolulu/.test(tz)) return 'US';
  } catch (e) {}
  return 'GB';
}

function fresh(topic = TOPIC_ALL) {
  return {
    scene: 'build', topic, tray: [], q: '',
    // The explored graph. Nodes are films you followed or picked; edges are
    // "this led to that". Walking back moves focus and destroys nothing —
    // round 2's headline complaint was that it did.
    graph: { nodes: {}, roots: [], focus: null },
    filters: { services: [], genre: null, director: null, actor: null },
    region: guessRegion(), keep: [], ranked: [], rank: null, comparisons: 0, badge: null,
    done: []          // every Ten finished this session, in order
  };
}

/* ── The graph ────────────────────────────────────────────────────────────── */
function node(id) { return S.graph.nodes[id]; }
function addNode(id, parent, kind) {
  let n = node(id);
  if (!n) {
    n = S.graph.nodes[id] = { id, parent: parent ?? null, kids: [], kind };
    if (n.parent == null) { if (!S.graph.roots.includes(id)) S.graph.roots.push(id); }
    else if (!S.graph.nodes[n.parent].kids.includes(id)) S.graph.nodes[n.parent].kids.push(id);
  }
  if (kind === 'followed') n.kind = 'followed';       // picking then following upgrades it
  return n;
}
function follow(id) {
  addNode(id, S.graph.focus, 'followed');
  S.graph.focus = id;
  save();
}
function trail() {
  const out = [];
  for (let id = S.graph.focus; id != null; id = node(id)?.parent ?? null) out.unshift(id);
  return out;
}
let S = load() || (() => { const st = fresh(); st.scene = 'intro'; return st; })();
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (!r || !r.topic || !Array.isArray(r.tray)) return null;
    r.done = Array.isArray(r.done) ? r.done : [];
    // Normalise anything an older build may not have written. A saved draft
    // that predates a field must not be able to crash the app that reads it.
    const base = fresh(r.topic);
    const merged = { ...base, ...r, graph: r.graph && r.graph.nodes ? r.graph : base.graph,
                     filters: { ...base.filters, ...(r.filters || {}) } };
    return prune(merged);
  } catch (e) { return null; }
}

/* Drop anything the shelf no longer holds.

   The catalog is rebuilt from TMDB, so a draft saved against an older build
   can name films that are simply not here any more. Defending at every read
   site is whack-a-mole — one missed `byId.get(id).t` blanked the whole map —
   so the state is cleaned once, on the way in. A node that goes takes its
   place in the chain with it: its children are re-parented to its parent, so
   a path stays a path rather than losing its middle. */
function prune(st) {
  const known = id => byId.has(id);
  st.tray = st.tray.filter(known);
  st.keep = (st.keep || []).filter(known);
  st.ranked = (st.ranked || []).filter(known);

  const g = st.graph || { nodes: {}, roots: [], focus: null };
  const nodes = {};
  for (const [k, n] of Object.entries(g.nodes || {})) {
    const id = Number(k);
    if (known(id)) nodes[id] = { ...n, id, kids: (n.kids || []).filter(known) };
  }
  // Re-parent orphans onto the nearest surviving ancestor.
  const survivingParent = n => {
    let p = n.parent;
    while (p != null && !nodes[p]) p = (g.nodes[p] || {}).parent ?? null;
    return p ?? null;
  };
  for (const n of Object.values(nodes)) n.parent = survivingParent(n);
  for (const n of Object.values(nodes)) {
    n.kids = Object.values(nodes).filter(k => k.parent === n.id).map(k => k.id);
  }
  st.graph = {
    nodes,
    roots: Object.values(nodes).filter(n => n.parent == null).map(n => n.id),
    focus: nodes[g.focus] ? g.focus : null
  };
  if (st.rank && st.rank.current != null && !known(st.rank.current)) { st.rank = null; st.scene = 'build'; }
  return st;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ── Scope and filters ────────────────────────────────────────────────────── */
function inTopic(f, t = S.topic) {
  if ((f.dm || 'movie') !== domainOf(t)) return false;
  if (t.director && f.d !== t.director) return false;
  if (t.actor && !(f.ca || []).includes(t.actor)) return false;
  if (t.genre && !f.g.includes(t.genre)) return false;
  if (t.decade && Math.floor(f.y / 10) * 10 !== t.decade) return false;
  return true;
}
function passesFilters(f) {
  const F = S.filters;
  if (F.services.length) {
    const on = (f.sv || {})[S.region] || [];
    if (!F.services.some(s => on.includes(s))) return false;
  }
  if (F.genre && !f.g.includes(F.genre)) return false;
  if (F.director && f.d !== F.director) return false;
  if (F.actor && !(f.ca || []).includes(F.actor)) return false;
  return true;
}
const pool = () => CAT.filter(f => inTopic(f) && passesFilters(f));

function facetValues(kind) {
  const counts = new Map();
  for (const f of CAT.filter(inTopic)) {
    const vals = kind === 'genre' ? f.g : kind === 'director' ? [f.d] : (f.ca || []);
    for (const v of vals) if (v) counts.set(v, (counts.get(v) || 0) + 1);
  }
  return [...counts.entries()].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

/* ── Suggestions ──────────────────────────────────────────────────────────
   Sections, each with a headline that says why it exists. A card carries a
   reason line ONLY when the section doesn't already give it — repeating
   "widely called great" under every poster is noise, not a reason.
   ─────────────────────────────────────────────────────────────────────── */
/* Weights, and why they are in this order (round 3, Mischa: "More like
   Interstellar starts with 2 films that are not Nolan films?").

   A shared author is the strongest claim we can make — the same director, or
   the same faces — because it is a reason a person would give. TMDB's
   recommendation edge is crowd behaviour: useful, but it put Avengers above
   Inception under "more like Interstellar", which reads as the app not
   understanding the question. Genre alone is the weakest signal and is
   deliberately worth less than one shared name. */
/* Why one film is "like" another is not one question, and answering it with
   one weight was the bug (Mischa, round 4).

   Toy Story's answer is the series, then Pixar. Top Gun: Maverick's is Tom
   Cruise. Interstellar's really is Nolan. So each link scores on its own axis
   and the strongest one both ranks the film and labels it — the card says
   which claim it is making, because "More Toy Story" and "Also Pixar" are
   different promises and the user should be told which they are getting.

   Where this stops: deciding whether authorship is even the point for a given
   film is a judgement about culture, not a fact in the metadata. That is the
   piece an on-device model is actually suited to — see specs/prd.md Req 5. */
const SIM = { collection: 14, brand: 5, director: 5, prolific: 1.2, lead: 6, cast: 2, rec: 5, genre: 1.5, era: 1 };

// A rail that is one person's filmography answers a question you did not ask.
const MAX_PER_DIRECTOR = 4;

const dirCount = (() => { const c = {}; for (const f of CAT) if (f.d) c[f.d] = (c[f.d] || 0) + 1; return c; })();

/* The axes are already generic — a series, an authored name, a brand, a
   shared subject, a crowd edge — so books needed no new ones. Only the words
   change: the crowd edge is read, not watched, and a second name on a book is
   a co-author rather than a face. */
function link(f, seed) {
  const parts = [], W = simwords();
  if (f.col && f.col === seed.col) parts.push([SIM.collection, { label: `More ${f.col.replace(/ Collection$/, '')}`, jump: null }]);
  const brand = (f.br || []).find(b => (seed.br || []).includes(b));
  if (brand) parts.push([SIM.brand, { label: `Also ${brand}`, jump: null }]);
  if (f.d && f.d === seed.d) parts.push([SIM.director * (dirCount[f.d] >= 4 ? SIM.prolific : 1),
    { label: `Also ${f.d}`, jump: { kind: 'director', value: f.d } }]);
  const shared = (f.ca || []).filter(c => (seed.ca || []).includes(c));
  const lead = shared.find(c => c === (seed.ca || [])[0] || c === (f.ca || [])[0]);
  if (lead) parts.push([SIM.lead, { label: `${W.with} ${lead}`, jump: { kind: 'actor', value: lead } }]);
  const others = shared.filter(c => c !== lead);
  if (others.length) parts.push([others.length * SIM.cast, { label: `${W.with} ${others[0]}`, jump: { kind: 'actor', value: others[0] } }]);
  if ((seed.r || []).includes(f.id)) parts.push([SIM.rec, { label: W.rec, jump: null }]);
  const g = f.g.filter(x => seed.g.includes(x));
  if (g.length) parts.push([g.length * SIM.genre, { label: `Also ${g[0].toLowerCase()}`, jump: { kind: 'genre', value: g[0] } }]);
  if (Math.abs(f.y - seed.y) <= 6) parts.push([SIM.era, null]);
  if (!parts.length) return null;
  const total = parts.reduce((a, b) => a + b[0], 0);
  const top = parts.slice().sort((a, b) => b[0] - a[0])[0];
  return { total, why: top[1] };
}

function similarTo(seed, exclude, limit = Infinity) {
  const ranked = [];
  for (const f of pool()) {
    if (f.id === seed.id || exclude.has(f.id)) continue;
    const l = link(f, seed);
    if (l) ranked.push({ f, ...l });
  }
  ranked.sort((a, b) => b.total - a.total || b.f.v - a.f.v);
  const perDirector = {};
  const out = [];
  for (const r of ranked) {
    const d = r.f.d || '—';
    if ((perDirector[d] = (perDirector[d] || 0) + 1) > MAX_PER_DIRECTOR) continue;
    out.push(r);
    if (out.length >= limit) break;
  }
  return out;
}

/* Everything that satisfies the current query — the honest denominator for
   the count in Now showing, independent of how many cards a rail renders. */
function matching() {
  if (S.q.trim()) {
    const q = S.q.trim().toLowerCase();
    return CAT.filter(f => inTopic(f) && passesFilters(f) && f.t.toLowerCase().includes(q));
  }
  if (S.graph.focus != null) {
    const seed = byId.get(S.graph.focus);
    if (seed) return similarTo(seed, new Set()).map(r => r.f);
  }
  return pool();
}

function sections() {
  const have = new Set(S.tray);
  const out = [];

  // Whatever the map is focused on leads the page.
  if (S.graph.focus != null) {
    const seed = byId.get(S.graph.focus);
    if (seed) {
      // Show every match, not a truncated ten — a count of 2 above a single
      // card is the app contradicting itself (round 3).
      const films = similarTo(seed, new Set(), 24);
      if (films.length) out.push({
        id: 'branch', title: `More like ${seed.t}`, branch: true,
        cards: films.map(r => ({ f: r.f, why: r.why }))
      });
    }
  }

  // Because you picked X — one section per recent pick, so it is a heading
  // you can see rather than a caption you might miss.
  for (const id of [...S.tray].reverse().slice(0, 2)) {
    const seed = byId.get(id); if (!seed) continue;
    if (S.graph.focus === id) continue;
    const films = similarTo(seed, have, 12);
    if (films.length >= 3) out.push({
      id: 'because' + id, title: `Because you picked ${seed.t}`, seed: id,
      cards: films.map(r => ({ f: r.f, why: r.why }))
    });
  }

  // One rail per subscription the user has told us about.
  for (const sid of S.filters.services.length ? S.filters.services : []) {
    const label = (SERVICES.find(s => s[0] === sid) || [, sid])[1];
    const films = pool().filter(f => !have.has(f.id) && ((f.sv || {})[S.region] || []).includes(sid)).slice(0, 12);
    if (films.length) out.push({ id: 'sv' + sid, title: `On ${label}`, cards: films.map(f => ({ f, why: '' })) });
  }

  const rest = pool().filter(f => !have.has(f.id) && !out.some(s => s.cards.some(c => c.f.id === f.id)));
  if (rest.length) out.push({ id: 'acclaimed', title: S.tray.length ? 'More to consider' : 'Start here', cards: rest.slice(0, 16).map(f => ({ f, why: '' })) });
  return out;
}

/* ── Rendering ────────────────────────────────────────────────────────────── */
function svgIcon(name) {
  const p = {
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    deeper: '<path d="M9 6l6 6-6 6"/>',
    up: '<path d="M12 8l-5 6h10z" fill="currentColor" stroke="none"/>',
    down: '<path d="M12 16l5-6H7z" fill="currentColor" stroke="none"/>'
  }[name];
  return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${p}</svg>`;
}

function cardHTML(c) {
  const inTen = S.tray.includes(c.f.id);
  return `<div class="card" data-card="${c.f.id}" data-in="${inTen ? 1 : 0}">
    <button class="art" data-add="${c.f.id}" aria-label="${inTen ? 'Remove' : 'Add'} ${esc(c.f.t)}" aria-pressed="${inTen}">
      <img src="${art(c.f, 'w342')}" alt="" loading="lazy" decoding="async">
      <svg class="ring" viewBox="0 0 120 180" preserveAspectRatio="none"><rect x="1.5" y="1.5" width="117" height="177" rx="6"/></svg>
    </button>
    <span class="in" aria-hidden="true">✓</span>
    <div class="t">${esc(c.f.t)}</div>
    ${c.why ? (c.why.jump
        ? `<div class="why"><button data-facetjump='${esc(JSON.stringify(c.why.jump))}'>${esc(c.why.label)}</button></div>`
        : `<div class="why"><span class="static">${esc(c.why.label)}</span></div>`) : ''}
    <div class="acts">
      <button class="do-add" data-add="${c.f.id}">${inTen ? '✓ Added' : '+ Add'}</button>
      <button class="do-similar" data-deeper="${c.f.id}" aria-label="Show ${nounFor()} like ${esc(c.f.t)}">Similar ${svgIcon('deeper')}</button>
    </div>
  </div>`;
}

function rowHTML(f) {
  const inTen = S.tray.includes(f.id);
  return `<li><div class="row" data-card="${f.id}" data-in="${inTen ? 1 : 0}">
    <span class="thumb"><img src="${art(f)}" alt="" loading="lazy"></span>
    <span class="meta"><span class="t">${esc(f.t)}</span><span class="s">${f.y}${f.d ? ' · ' + esc(f.d) : ''}</span></span>
    <button class="add" data-add="${f.id}" aria-label="${inTen ? 'Remove' : 'Add'} ${esc(f.t)}" aria-pressed="${inTen}">${inTen ? '✓' : '+'}</button>
    <button class="add" data-deeper="${f.id}" aria-label="More ${nounFor()} like ${esc(f.t)}">${svgIcon('deeper')}</button>
  </div></li>`;
}

/* Every clause of the current query, stated and droppable, with the count
   that proves it did something. Round 2: "Can't tell what selecting a Genre
   filter does… am I looking at movies like Spider-Man that are also in the
   Drama genre and on one of my 3 services?" — this is that sentence. */
function showingBar(q, results) {
  const F = S.filters, clauses = [];
  for (const id of trail()) {
    const f = byId.get(id); if (!f) continue;
    // A long title wraps the chip onto two lines and makes the bar look
    // broken; the full name is one tap away on the chip itself.
    const short = f.t.length > 26 ? f.t.slice(0, 25) + '…' : f.t;
    clauses.push({ label: `Like ${short}`, act: `data-focusnode="${id}"`, drop: `data-dropfocus="${id}"` });
  }
  if (F.services.length) {
    const names = F.services.map(sid => (SERVICES.find(x => x[0] === sid) || [, sid])[1]).join(', ');
    clauses.push({ label: `On ${names}`, act: 'data-sheet="services"', drop: 'data-clear="services"' });
  }
  for (const k of ['genre', 'director', 'actor']) {
    if (F[k]) clauses.push({ label: F[k], act: `data-sheet="${k}"`, drop: `data-clear="${k}"` });
  }
  if (q) clauses.push({ label: `“${q}”`, act: '', drop: 'data-act="clearq"' });

  // The count is of everything that matches, not of the cards a rail happened
  // to render. Those were different numbers, which read as a bug (round 3).
  const n = matching().length;

  return `<div class="showing">
    <div class="lead">Now showing</div>
    <div class="clauses">
      ${clauses.length
        ? clauses.map(c => `<span class="clause"><button ${c.act}>${esc(c.label)}</button><button class="x" ${c.drop} aria-label="Remove ${esc(c.label)}">×</button></span>`).join('')
        // "Everything" was a lie about a 600-title catalog (round 3). Say
        // what is actually there.
        : `<span class="count">All ${CAT.length} ${nounFor()} in our collection</span>`}
      ${clauses.length ? `<span class="count">${countNoun(n)}</span>` : ''}
      <button class="mapbtn" data-act="openmap">Map</button>
    </div>
    ${n === 0 ? deadEnd() : ''}
  </div>`;
}

/* A dead end should hand you the way out, not just report the wall. For each
   clause, how many films you would get back by dropping it — and only the
   drops that actually help are offered. Round 3, Mischa: "When I got a dead
   end (0 results), could we recommend related paths that have suggestions?" */
function deadEnd() {
  const escapes = [];
  const F = S.filters, saved = JSON.parse(JSON.stringify(F)), savedFocus = S.graph.focus, savedQ = S.q;

  const tryWithout = (label, mutate, restore, drop) => {
    mutate();
    const n = matching().length;
    restore();
    if (n > 0) escapes.push({ label, n, drop });
  };

  for (const k of ['genre', 'director', 'actor']) {
    if (F[k]) tryWithout(F[k], () => { F[k] = null; }, () => { F[k] = saved[k]; }, `data-clear="${k}"`);
  }
  if (F.services.length) {
    tryWithout('your services', () => { F.services = []; }, () => { F.services = saved.services.slice(); }, 'data-clear="services"');
  }
  if (S.graph.focus != null) {
    const f = byId.get(S.graph.focus);
    tryWithout(`“like ${f.t}”`, () => { S.graph.focus = node(savedFocus)?.parent ?? null; },
      () => { S.graph.focus = savedFocus; }, `data-dropfocus="${savedFocus}"`);
  }
  if (S.q) tryWithout(`“${S.q}”`, () => { S.q = ''; }, () => { S.q = savedQ; }, 'data-act="clearq"');

  escapes.sort((a, b) => b.n - a.n);
  if (!escapes.length) return `<p class="deadend">Nothing in our collection matches all of that.</p>`;
  return `<div class="deadend">
    <p>Nothing matches all of that. Dropping one gets you moving again:</p>
    <div class="escapes">${escapes.map(e =>
      `<button class="escape" ${e.drop}>Without ${esc(e.label)} · ${countNoun(e.n)}</button>`).join('')}</div>
  </div>`;
}

function filterChips() {
  const F = S.filters, A = axes();
  const svLabel = F.services.length === 1 ? (SERVICES.find(s => s[0] === F.services[0]) || [, ''])[1]
    : F.services.length ? `${F.services.length} services` : A.services;
  const chip = (k, on, label) => `<button class="chip ${on ? 'on' : ''}" data-sheet="${k}">${esc(label)}${on ? ` <span class="x" data-clear="${k}">×</span>` : ''}</button>`;
  return `<div class="chips">
    ${A.services ? chip('services', F.services.length, svLabel) : ''}
    ${A.genre ? chip('genre', F.genre, F.genre || A.genre) : ''}
    ${A.director ? chip('director', F.director, F.director || A.director) : ''}
    ${A.actor ? chip('actor', F.actor, F.actor || A.actor) : ''}
  </div>`;
}

function renderBuild() {
  const q = S.q.trim().toLowerCase();
  const results = q ? CAT.filter(f => inTopic(f) && passesFilters(f) && f.t.toLowerCase().includes(q)).slice(0, 30) : [];

  let body;
  if (q) {
    body = `<section><ol>${results.map(rowHTML).join('') ||
      `<li class="empty">No match in this prototype's collection of ${countNoun(pool().length)}.</li>`}</ol></section>`;
  } else {
    const secs = sections();
    // No per-section navigation verbs. "Back" and "Go deeper" sat next to
    // each other meaning different kinds of thing (round 2: "hard to tell what
    // these will do"); navigation now lives in one place — the Now showing bar
    // and the map.
    body = secs.map(s => `<section>
        <div class="section-head"><h2 class="section-h">${esc(s.title)}</h2></div>
        <div class="rail">${s.cards.map(cardHTML).join('')}</div>
      </section>`).join('') || '';
  }

  app.innerHTML = `
    <div class="topbar">
      <h1 class="display-lg">${esc(S.topic.title)}</h1>
      <button class="link" data-act="restart">Start over</button>
    </div>
    <p class="prompt">${esc(S.topic.prompt)}</p>

    <div class="search">
      ${svgIcon('search')}
      <input id="q" type="search" autocomplete="off" placeholder="Search ${nounFor()}" value="${esc(S.q)}" aria-label="Search ${nounFor()}">
      ${S.q ? '<button class="clear" data-act="clearq" aria-label="Clear search">×</button>' : ''}
    </div>
    ${filterChips()}
    ${showingBar(q, results)}
    ${body}
    ${notes()}`;

  renderDock();
  const qi = $('#q');
  if (qi) {
    // Live autocomplete, debounced — no submit step (Stack search rule).
    let t;
    qi.oninput = e => {
      const v = e.target.value;
      clearTimeout(t);
      t = setTimeout(() => { S.q = v; save(); const at = qi.selectionStart; renderBuild(); const n = $('#q'); if (n) { n.focus(); try { n.setSelectionRange(at, at); } catch (e) {} } }, 220);
    };
  }
}

function renderDock() {
  const n = S.tray.length, over = n > 10;
  const hint = over ? `${n - 10} too many — make the cut`
    : n === 10 ? 'Arrange them, then you are done'
    : n === 0 ? 'Tap a poster to start'
    : `${10 - n} to go`;
  const slots = [];
  for (let i = 0; i < Math.max(10, n); i++) {
    const f = byId.get(S.tray[i]);
    slots.push(`<div class="slotmini ${i === 0 ? 'one' : ''}" data-slot="${i}">${
      f ? `<img src="${art(f)}" alt="${esc(f.t)}">` : `<span class="gh">${i + 1}</span>`}</div>`);
  }
  dockEl.innerHTML = `<div class="dock"><div class="dock-in">
    <div class="dock-top">
      <div>
        <div class="n ${over ? 'over' : ''}">${n} of 10</div>
        <div class="hint">${esc(hint)}</div>
      </div>
      <button class="btn" data-act="${over ? 'cut' : 'arrange'}" ${n === 10 || over ? '' : 'disabled'}>${over ? 'Make the cut' : 'Arrange'}</button>
    </div>
    <button class="slots" data-act="openten" aria-label="Open your Ten to reorder">${slots.join('')}</button>
  </div></div>`;
  measureDock();
}

/* The page must clear the dock exactly, whatever the dock currently is —
   the count row grows a line, the safe-area inset differs per device. */
function measureDock() {
  const d = $('.dock', dockEl);
  if (d) document.documentElement.style.setProperty('--dock-h', d.offsetHeight + 'px');
}
addEventListener('resize', measureDock);

function notes() {
  return `<footer class="notes">
    <p>Structure prototype. Glass, haptics, and final motion are judged on
    device, not here. Judge the flow, the anatomy, and the words.</p>
    <p class="build">build 0010 · intro copy · US voice · other Top 10 lists</p>
  </footer>`;
}

/* ── The add hand-off ──────────────────────────────────────────────────────
   Stack's law: acting on a row must not make the row leave. The card stays
   exactly where it is and shows its new state; what moves is a copy of the
   poster, travelling to the slot it just filled, so where it went is never
   in question.
   ───────────────────────────────────────────────────────────────────────── */
function addFilm(id, sourceEl) {
  if (S.tray.includes(id)) { removeFilm(id); return; }
  const f = byId.get(id); if (!f) return;

  const art = sourceEl ? sourceEl.closest('.card, .row')?.querySelector('img') : null;
  const from = art ? art.getBoundingClientRect() : null;

  S.tray.push(id);
  addNode(id, S.graph.focus, 'picked');   // the map shows outcomes, not just detours
  save();
  renderDock();

  const index = S.tray.length - 1;
  const target = $(`.slotmini[data-slot="${index}"]`);
  if (from && target && !reduced()) flyTo(art, from, target.getBoundingClientRect());
  if (target) { target.classList.add('landing'); setTimeout(() => target.classList.remove('landing'), 400); }

  markCard(id, true);
  announce(`${f.t} added. ${S.tray.length} of ten.`);
}

function removeFilm(id) {
  S.tray = S.tray.filter(x => x !== id);
  save();
  renderDock();
  markCard(id, false);
  const f = byId.get(id);
  if (f) announce(`${f.t} removed. ${S.tray.length} of ten.`);
}

/* The ring is really drawn, not faded in — the travel is what makes it read
   as an act rather than a repaint (Stack, StatusRing). It retreats faster
   than it draws, and on an ease-out, because undoing should not look
   reluctant. */
function markCard(id, on) {
  for (const el of $$(`[data-card="${id}"]`)) {
    el.dataset.in = on ? '1' : '0';
    const btn = el.querySelector('[data-add]');
    if (btn) { btn.setAttribute('aria-pressed', String(on)); if (btn.classList.contains('add')) btn.textContent = on ? '✓' : '+'; }
    const rect = el.querySelector('.ring rect');
    if (!rect) continue;
    const len = rect.getTotalLength ? rect.getTotalLength() : 600;
    rect.style.stroke = 'var(--accent-bright)';
    rect.style.strokeDasharray = len;
    if (reduced()) { rect.style.transition = 'none'; rect.style.strokeDashoffset = on ? 0 : len; continue; }
    rect.style.transition = 'none';
    rect.style.strokeDashoffset = on ? len : 0;
    rect.getBoundingClientRect();
    rect.style.transition = on
      ? `stroke-dashoffset var(--m-ring) var(--ease-out)`
      : `stroke-dashoffset var(--m-retreat) ease-out`;
    rect.style.strokeDashoffset = on ? 0 : len;
  }
}

function flyTo(img, from, to) {
  const fl = document.createElement('div');
  fl.className = 'flier';
  fl.style.cssText = `left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;transition:transform var(--m-travel) var(--ease-out),opacity var(--m-travel) ease;`;
  fl.innerHTML = `<img src="${img.src}" alt="">`;
  document.body.appendChild(fl);
  requestAnimationFrame(() => {
    const sx = to.width / from.width, sy = to.height / from.height;
    fl.style.transformOrigin = 'top left';
    fl.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${sx}, ${sy})`;
    fl.style.opacity = '0.9';
  });
  setTimeout(() => fl.remove(), 420);
}

/* ── Sheets ───────────────────────────────────────────────────────────────── */
function openSheet(kind) {
  let inner = '';
  if (kind === 'ten') {
    inner = `<div class="sheet-head"><h2>Your Ten</h2><button class="done" data-act="closesheet">Done</button></div>
      ${S.tray.length ? `<ol id="tenlist">${S.tray.map((id, i) => tenRow(id, i)).join('')}</ol>` : '<p class="empty">Nothing picked yet.</p>'}
      <div style="display:flex;gap:var(--s2);margin-top:var(--s4)">
        ${S.tray.length >= 2 ? `<button class="btn ghost" data-act="duel">Rank them for me</button>` : ''}
        ${S.tray.length === 10 ? `<button class="btn" data-act="finish">This is my Ten</button>` : ''}
      </div>`;
  } else if (kind === 'services') {
    const group = free => SERVICES.filter(row => Boolean(row[2]) === free)
      .map(([id, label]) => `<button class="chip ${S.filters.services.includes(id) ? 'on' : ''}" data-toggle-service="${id}" aria-pressed="${S.filters.services.includes(id)}">${esc(label)}</button>`).join('');
    inner = `<div class="sheet-head"><h2>Where you can watch</h2><button class="done" data-act="closesheet">Done</button></div>
      <p class="prompt" style="margin:0 0 var(--s4)">Pick what you have and the suggestions lean toward what you could actually watch tonight.</p>
      <p class="section-h">Subscriptions</p>
      <div class="chips" style="flex-wrap:wrap;overflow:visible;margin:var(--s2) 0 var(--s6);padding:0;gap:var(--s2)">${group(false)}</div>
      <p class="section-h">Free with ads</p>
      <div class="chips" style="flex-wrap:wrap;overflow:visible;margin:var(--s2) 0 0;padding:0;gap:var(--s2)">${group(true)}</div>`;
  } else {
    const vals = facetValues(kind);
    const cur = S.filters[kind];
    inner = `<div class="sheet-head"><h2>${esc(axes()[kind] || kind)}</h2><button class="done" data-act="closesheet">Done</button></div>
      <ol>${vals.slice(0, 60).map(([v, n]) => `<li><button class="row" data-facet="${kind}" data-value="${esc(v)}" style="border-bottom:1px solid var(--border-subtle);min-height:52px">
        <span class="meta"><span class="t">${esc(v)}</span><span class="s">${countNoun(n)}</span></span>
        <span class="add" aria-hidden="true">${cur === v ? '✓' : '+'}</span></button></li>`).join('')}</ol>`;
  }

  sheetsEl.innerHTML = `<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${inner}</div></div>`;
  requestAnimationFrame(() => { $('.scrim').classList.add('on'); $('.sheet').classList.add('on'); });
  app.inert = true; dockEl.inert = true;
}
function closeSheet() {
  const sc = $('.scrim'), sh = $('.sheet');
  if (sc) sc.classList.remove('on');
  if (sh) sh.classList.remove('on');
  app.inert = false; dockEl.inert = false;
  setTimeout(() => {
    sheetsEl.innerHTML = '';
    // Rebuild what is behind the sheet. Held order is right while the user

/* ── The map ──────────────────────────────────────────────────────────────
   Every film you followed or picked, and what led to what. Tapping a node
   re-enters the path there; nothing is ever removed by navigating.
   ─────────────────────────────────────────────────────────────────────────── */
const MAP = { w: 56, h: 84, gx: 26, gy: 58, pad: 14, originH: 44 };

// about 4.6px a character, so a 56px node holds ~12 before it has to stop.
const mapLabel = t => (t.length > 12 ? t.slice(0, 11) + '…' : t);

/* Unexplored next steps, drawn off whatever is focused. Without these the map
   is a history log; with them it is somewhere you can actually go (round 3:
   "no ways to drill more into anything").

   They hang off a film you have ACTUALLY FOLLOWED, and never off the origin.
   The old fallback answered "what next" with the top four films of the shelf
   and drew them as children of the topic plate, which is precisely the
   phantom selection Mischa hit: "what could come next" needs a "now", and at
   the origin the whole build screen already is that. (2026-08-15) */
function ghostsFor(focusId) {
  if (focusId == null || !node(focusId)) return [];
  const seed = byId.get(focusId);
  if (!seed) return [];
  const known = new Set(Object.keys(S.graph.nodes).map(Number));
  return similarTo(seed, known, 4).map(r => r.f.id);
}

function layoutMap(ghosts, focus) {
  const placed = [];
  let cursor = 0;
  const walk = (id, depth) => {
    // A ghost is a film that is not in the graph yet, so it has no children —
    // it just takes a slot. Treating one as a real node threw here.
    const n = node(id);
    const kids = n ? n.kids.filter(k => node(k)).concat(id === focus ? ghosts : []) : [];
    let slot;
    if (!kids.length) { slot = cursor++; }
    else {
      const xs = kids.map(k => walk(k, depth + 1));
      slot = (xs[0] + xs[xs.length - 1]) / 2;
    }
    placed.push({ id, depth, slot, ghost: !node(id) });
    return slot;
  };
  // Only real roots. There is no "walk the ghosts as though they were roots"
  // case any more: with nothing explored the map does not draw a graph at
  // all, it draws its empty state (2026-08-15).
  const rootSlots = S.graph.roots.filter(r => node(r)).map(r => walk(r, 1));
  // A single origin so the whole thing reads as one map rather than several.
  const origin = { id: null, depth: 0, slot: rootSlots.length ? (rootSlots[0] + rootSlots[rootSlots.length - 1]) / 2 : 0 };
  placed.push(origin);
  const pos = p => ({
    cx: MAP.pad + p.slot * (MAP.w + MAP.gx) + MAP.w / 2,
    cy: MAP.pad + p.depth * (MAP.h + MAP.gy) + MAP.h / 2
  });
  const width = MAP.pad * 2 + Math.max(cursor, 1) * (MAP.w + MAP.gx);
  const depth = Math.max(...placed.map(p => p.depth));
  const height = MAP.pad * 2 + (depth + 1) * (MAP.h + MAP.gy);
  return { placed, pos, width, height };
}

/* The map's four states, each with a marker whose SHAPE says which it is, so

const KEY_SWATCH = {

const MAP_BLANK = `<div class="map-empty">
  <svg class="blank-art" width="188" height="106" viewBox="0 0 188 106" aria-hidden="true" focusable="false">

function drawMap(ghosts, focus) {
  const { placed, pos, width, height } = layoutMap(ghosts, focus);
  const at = new Map(placed.map(p => [p.id, pos(p)]));

        aria-label="${esc(f.t)}${picked ? ', in your Ten' : ', followed'}${isFocus ? ', where you are' : ''}">
      ${isFocus ? hereMark(c.cx, top) : ''}
      <rect class="plate" x="${c.cx - MAP.w / 2 - 2}" y="${top}" width="${MAP.w + 4}" height="${MAP.h + 4}" rx="8"/>
      <image href="${IMG}w185${f.p}" x="${c.cx - MAP.w / 2}" y="${c.cy - MAP.h / 2}" width="${MAP.w}" height="${MAP.h}"
        preserveAspectRatio="xMidYMid slice" style="clip-path:inset(0 round 6px)"/>
      ${picked ? `<circle class="map-tick" cx="${c.cx + MAP.w / 2 - 4}" cy="${c.cy - MAP.h / 2 + 4}" r="8"/>
        <text x="${c.cx + MAP.w / 2 - 4}" y="${c.cy - MAP.h / 2 + 7}" text-anchor="middle" style="fill:#17140B;font-weight:800">✓</text>` : ''}

function renderMap() {
  // A focus that no longer resolves to a node (a rebuilt shelf, a pruned
  // draft) is the origin, not a dangling id.
  const focus = node(S.graph.focus) ? S.graph.focus : null;
  const explored = S.graph.roots.some(r => node(r));
  const ghosts = explored ? ghostsFor(focus) : [];
  const drawn = explored ? drawMap(ghosts, focus) : null;

  const v = document.createElement('div');
  v.className = 'mapview';
  v.innerHTML = `
    <div class="map-head"><h2>Map of your selections</h2><button class="done" data-act="closemap">Done</button></div>
    ${mapContext()}
    ${drawn ? mapKey(drawn.states) : ''}
    <div class="map-scroll">${drawn ? drawn.svg : MAP_BLANK}</div>`;
  document.body.appendChild(v);
  setBackgroundInert(true);

  // Centre on where you are. A map that opens at its top-left corner drops
  // you in blank space the moment the graph is wider than the screen.
  // Measured deltas, not scrollIntoView — that does nothing for an SVG group
  // in Chromium — and run on a second frame too, because on the first the
  // scroller has not yet taken the SVG's width and the scroll clamps to zero.

    const el = $('.map-node.focus', v), sc = $('.map-scroll', v);

    sc.scrollLeft += (a.left + a.width / 2) - (b.left + b.width / 2);
    sc.scrollTop += (a.top + a.height / 2) - (b.top + b.height / 2);

/* The map has to say what it is filtered by, or it looks like it has lost

function mapContext() {

  // changes what is offered next, never what the map has recorded.

    change what is offered next, never the path the map records.</p>`;

/* ── Discover ─────────────────────────────────────────────────────────────
   Introduced after the second finished Ten (Mischa, 2026-08-15): by then the
   mechanic is understood and other people's lists are interesting rather than
   confusing. Earlier, they are just someone else's opinions about a thing you
   have not done yet.

   The badges here are LOCKED — PRD Req 12. You see the whole list; the badge
   is the part you earn by making your own take on the same topic, and it
   unlocks retroactively for every take on that topic at once.

   Two of these seven share a topic (Sam and Theo, both on Crime). That is not
   filler: Req 12 promises a take unlocks EVERY list on that topic at once, and
   with one list per topic that promise is unobservable and untestable. */
const PEOPLE = [
  { name: 'Sam', bias: 'Crime' },
  { name: 'Priya', bias: 'Science Fiction' },
  { name: 'Marcus', bias: 'Animation' },
  { name: 'Nour', bias: 'Thriller' },
  { name: 'Theo', bias: 'Crime' },
  { name: 'Eddie', bias: 'Comedy' },
  { name: 'Rae', bias: 'Drama' },
].map(p => ({ ...p, topic: { id: `movie:genre:${p.bias}`, domain: 'movie', genre: p.bias,
  title: `${p.bias} movies`, prompt: `Your 10 favorite ${p.bias.toLowerCase()} movies.` } }));

/* ── Naming a list, from the list itself ──────────────────────────────────
   A list's name is GENERATED from its contents. Nobody types it (PRD Req 12
   amendment, 2026-08-15): free text on a social surface is a moderation and
   safety surface, and this product does not need one to say what a list is.

   Every candidate below is a template plus the fact that licenses it, and the
   fact is counted off the ten films themselves — so a name can be bland but
   never wrong. `listNameCandidates` returns the whole ranked set; on device
   the Foundation Models pass picks among exactly these candidates under the
   badge-inscription rules in badges.md (id-constrained choice, relevancy and
   safety checks, no free generation), and this deterministic ordering is the
   fallback when the model is unavailable or its choice fails a check.

   Ranking is by how much the fact DISTINGUISHES the list. A shared author is
   the strongest claim a list can make (design.md, round 3: a shared name is a
   reason a person would give out loud); genre purity is the floor, because on
   a genre topic it only restates the topic. */
const census = arr => { const m = new Map();
  for (const x of arr) m.set(x, (m.get(x) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]))); };

  return { value: c.length ? c[0][0] : null, n: c.length ? c[0][1] : 0, runnerUp: c[1] ? c[1][1] : 0 }; };
// "Alfred Hitchcock" -> Hitchcock, but "Bong Joon Ho" stays whole: a two-letter
// tail is a given name's second half, not a surname.
const surname = name => { const p = String(name).split(/\s+/).filter(Boolean);
  return p.length > 1 && p[p.length - 1].length > 3 ? p[p.length - 1] : String(name); };
const shortBrand = b => String(b).replace(/^(Studio|Walt)\s+/, '').replace(/\s+(Animation|Pictures|Studios|Entertainment)$/, '');
const shortGenre = g => (g === 'Science Fiction' ? 'Sci-fi' : g);
const decadeName = d => (d >= 2000 ? `${d}s` : `${String(d).slice(2)}s`);
const THIS_YEAR = new Date().getFullYear();

function listNameCandidates(films, topic) {
  const out = [], push = (score, name, fact) => out.push({ score, name, fact });
  if (!films || films.length < 2) return out;

  const author = commonest(films.map(f => f.d).filter(Boolean));
  if (author.n >= 3) push(60 + 4 * author.n,
    author.n >= 4 ? `Everything ${surname(author.value)} touched` : `${surname(author.value)} keeps showing up`,
    { kind: 'author', value: author.value, n: author.n });

  const brand = commonest(films.flatMap(f => f.br || []));
  if (brand.n >= 3) push(55 + 4 * brand.n, `Raised by ${shortBrand(brand.value)}`,
    { kind: 'brand', value: brand.value, n: brand.n });

  // Billed cast only: a face you would recognise on the poster, not the
  // fourteenth name in the credits.
  const face = commonest(films.flatMap(f => (f.ca || []).slice(0, 3)));
  if (face.n >= 3) push(50 + 4 * face.n, `Whatever ${face.value} is in`,
    { kind: 'cast', value: face.value, n: face.n });

  const series = films.filter(f => f.col).length;
  if (series >= 7) push(45, 'Nothing stands alone', { kind: 'series', value: null, n: series });

  // A decade only "stands out" if it beats the next one by more than a nose.
  const dec = commonest(films.map(f => Math.floor(f.y / 10) * 10));
  if (dec.n >= 4 && dec.n - dec.runnerUp >= 2) push(40,
    dec.value < 2000 ? `The ${decadeName(dec.value)} did it better` : `A very ${decadeName(dec.value)} list`,
    { kind: 'era', value: dec.value, n: dec.n });

  const old = films.filter(f => THIS_YEAR - f.y >= 25).length;
  if (old >= 7) push(30, 'Nothing here is new', { kind: 'vintage', value: THIS_YEAR - 25, n: old });

  const gen = commonest(films.flatMap(f => f.g || []));
  if (gen.n === films.length) push(20, `${shortGenre(gen.value)}, and nothing but`,
    { kind: 'purity', value: gen.value, n: gen.n });

  return out.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}
// The chosen name. No candidate qualifying means no fact was strong enough to
// claim anything, and the topic is the honest answer.
function listName(films, topic) {
  const c = listNameCandidates(films, topic);
  return c.length ? c[0].name : (topic && topic.title) || 'A Top 10';
}

function theirTen(person) {
