/* ── Optional guided ranking ──────────────────────────────────────────────── */
function startDuel() {
  const items = S.tray.slice(0, 10);
  const order = items.slice();
  S.ranked = [order[0]];
  S.rank = { queue: order.slice(1), current: null, lo: 0, hi: 1 };
  S.comparisons = 0; S.scene = 'rank';
  closeSheet(); nextPlacement();
}
function nextPlacement() {
  const r = S.rank;
  if (r.current === null) {
    if (!r.queue.length) return endDuel();
    r.current = r.queue.shift(); r.lo = 0; r.hi = S.ranked.length;
  }
  if (r.lo >= r.hi) {
    S.ranked.splice(r.lo, 0, r.current); r.current = null; save();
    if (!r.queue.length) return endDuel();
    return nextPlacement();
  }
  save(); renderDuel();
}
function answer(higher) {
  const r = S.rank, mid = (r.lo + r.hi) >> 1;
  if (higher) r.hi = mid; else r.lo = mid + 1;
  S.comparisons++; nextPlacement();
}
function endDuel() {
  S.tray = S.ranked.slice(); S.rank = null; S.scene = 'build'; save();
  renderBuild(); openSheet('ten');
  announce('Ranked. Check the order, then finish.');
}
function renderDuel() {
  const r = S.rank, mid = (r.lo + r.hi) >> 1;
  const cur = byId.get(r.current), piv = byId.get(S.ranked[mid]);
  app.innerHTML = `
    <div class="topbar"><h1 class="display-lg">Which is higher?</h1></div>
    <p class="prompt">${S.ranked.length} of ${S.tray.length} placed · ${S.comparisons} question${S.comparisons === 1 ? '' : 's'}</p>
    <div class="duel">
      <button data-higher="1"><img src="${art(cur, 'w342')}" alt=""><div class="t">${esc(cur.t)}</div></button>
      <button data-higher="0"><img src="${art(piv, 'w342')}" alt=""><div class="t">${esc(piv.t)}</div></button>
    </div>
    <div class="progress">${Array.from({ length: S.tray.length }, (_, i) => `<i class="${i < S.ranked.length ? 'on' : ''}"></i>`).join('')}</div>
    ${notes()}`;
  dockEl.innerHTML = '';
  announce(`Which is higher: ${cur.t} or ${piv.t}?`);
}

/* ── Badge (unchanged from build 0002 apart from where it is called) ─────── */
function hash(str) { let h = 2166136261; for (const c of String(str)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const SHAPES = ['seal', 'shield', 'oval', 'stub', 'hex', 'lozenge'];
const MOTIFS = { Crime: 'briefcase', Thriller: 'eye', 'Science Fiction': 'planet', Horror: 'skull', Romance: 'rose',
  Animation: 'star', Drama: 'mask', Comedy: 'grin', War: 'helm', Adventure: 'compass', Action: 'flame',
  Fantasy: 'sword', Music: 'note', History: 'column', Western: 'sun', Family: 'star', Mystery: 'eye', Documentary: 'column',
  Gothic: 'skull', Historical: 'column', Philosophy: 'column', Religion: 'column', Poetry: 'note',
  Mythology: 'sword', Dystopia: 'eye', Satire: 'grin', Biography: 'mask', 'Short Stories': 'star',
  Nonfiction: 'column', Science: 'planet', Politics: 'column', Travel: 'compass' };

function facts(ids) {
  const fs = ids.map(i => byId.get(i)).filter(Boolean);
  const gc = {}, dc = {}, dec = {};
  for (const f of fs) {
    for (const g of f.g) if (g) gc[g] = (gc[g] || 0) + 1;
    if (f.d) dc[f.d] = (dc[f.d] || 0) + 1;
    const d = Math.floor(f.y / 10) * 10; dec[d] = (dec[d] || 0) + 1;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0] || [null, 0];
  const years = fs.map(f => f.y);
  return { films: fs, genre: top(gc), director: top(dc), decade: top(dec), span: Math.max(...years) - Math.min(...years) };
}
function compose(ids, topic) {
  const F = facts(ids), seed = hash(ids.join(',') + topic.title);
  const pal = F.films.slice(0, 3).map(f => f.c);
  return { shape: SHAPES[seed % SHAPES.length], motif: MOTIFS[F.genre[0]] || 'laurel', seed,
    primary: pal[0] || '#6E675D', secondary: pal[1] || pal[0] || '#3A311A', metal: '#C9A227',
    inscription: inscribe(F, seed, topic) };
}
function inscribe(F, seed, topic) {
  const [g, gn] = F.genre, [d, dn] = F.director, [dec, decn] = F.decade;
  const second = F.films[1];
  const N = noun(0, topic);
  const short = t => t.split(/[:—–-]/)[0].trim();
  const c = [];
  const N = nounFor(topic);
  if (dn >= 3) c.push(`${dn} ${d.split(' ').pop()} ${N}, no apologies`);
  if (gn >= 4) c.push(`${gn} ${g.toLowerCase()} ${N}, zero regrets`);
  if (decn >= 4) c.push(`The ${dec}s never let go`);
  if (F.span >= 45) c.push(`${F.span} years, one taste`);
  if (second) c.push(`Everything after ${short(second.t)}`);
  if (gn >= 3) c.push(`Ranked in ${g.toLowerCase()} order`);
  c.push('Ten hills, all defended', 'Argued into this order');
  const rank1 = F.films[0] ? F.films[0].t.toLowerCase() : '';
  const ok = c.filter(l => l.split(/\s+/).length <= 6 && (!rank1 || !l.toLowerCase().includes(rank1)));
  return ok.length ? ok[seed % ok.length] : 'Ten hills, all defended';
}
function badgeSVG(c, s = 200) {
  const half = s / 2;
  const plate = {
    seal: `<circle cx="${half}" cy="${half}" r="${half - 10}"/>`,
    shield: `<path d="M${half} 12 L${s - 18} 42 V${half + 10} Q${s - 18} ${s - 22} ${half} ${s - 10} Q18 ${s - 22} 18 ${half + 10} V42 Z"/>`,
    oval: `<ellipse cx="${half}" cy="${half}" rx="${half - 26}" ry="${half - 10}"/>`,
    stub: `<path d="M22 34 H${s - 22} V${half - 14} A14 14 0 0 0 ${s - 22} ${half + 14} V${s - 34} H22 V${half + 14} A14 14 0 0 0 22 ${half - 14} Z"/>`,
    hex: `<path d="M${half} 10 L${s - 16} ${half / 2 + 8} V${s - half / 2 - 8} L${half} ${s - 10} L16 ${s - half / 2 - 8} V${half / 2 + 8} Z"/>`,
    lozenge: `<path d="M14 ${half} L46 26 H${s - 46} L${s - 14} ${half} L${s - 46} ${s - 26} H46 Z"/>`
  }[c.shape];
  const M = {
    briefcase: `<rect x="66" y="86" width="68" height="46" rx="5"/><path d="M86 86 V76 a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v10" fill="none" stroke-width="7"/>`,
    eye: `<path d="M56 100 Q100 66 144 100 Q100 134 56 100 Z" fill="none" stroke-width="7"/><circle cx="100" cy="100" r="13"/>`,
    planet: `<circle cx="100" cy="98" r="26"/><ellipse cx="100" cy="98" rx="46" ry="15" fill="none" stroke-width="6" transform="rotate(-18 100 98)"/>`,
    skull: `<path d="M100 66 c-24 0-40 17-40 38 0 12 6 19 12 24 v10 h56 v-10 c6-5 12-12 12-24 0-21-16-38-40-38z"/>`,

    star: `<path d="M100 62 L112 92 L145 94 L119 114 L128 146 L100 128 L72 146 L81 114 L55 94 L88 92 Z"/>`,

    flame: `<path d="M100 60 c16 22 30 30 30 50 a30 30 0 0 1-60 0c0-14 10-20 16-30 4 10 10 12 14 6 4-8-2-16 0-26z"/>`,
    sword: `<rect x="94" y="58" width="12" height="70"/><rect x="74" y="126" width="52" height="10" rx="4"/><rect x="94" y="136" width="12" height="16"/>`,
    note: `<circle cx="84" cy="128" r="15"/><rect x="96" y="62" width="9" height="66"/><path d="M105 62 q22 6 22 22" fill="none" stroke-width="8"/>`,
    column: `<rect x="76" y="76" width="48" height="8"/><rect x="82" y="84" width="10" height="46"/><rect x="108" y="84" width="10" height="46"/><rect x="72" y="130" width="56" height="9"/>`,
    sun: `<circle cx="100" cy="100" r="22"/>` + Array.from({ length: 8 }, (_, i) => `<rect x="97" y="52" width="6" height="16" transform="rotate(${i * 45} 100 100)"/>`).join(''),
    laurel: `<path d="M100 60 v78" stroke-width="6" fill="none"/>`
  }[c.motif] || '';
  const rivets = Array.from({ length: 8 }, (_, i) => {
    const a = (i / 8) * Math.PI * 2, R = half - 22;
    return `<circle cx="${(half + Math.cos(a) * R).toFixed(1)}" cy="${(half + Math.sin(a) * R).toFixed(1)}" r="3" fill="${c.metal}" opacity=".85"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${s} ${s}" role="img" aria-label="Badge: ${esc(c.inscription)}">
    <defs><linearGradient id="f${c.seed}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c.primary}"/><stop offset="100%" stop-color="${c.secondary}"/></linearGradient></defs>
    <g class="layer" id="l-plate" fill="url(#f${c.seed})">${plate}</g>

    <g class="layer" id="l-metal" fill="none">
      <g stroke="${c.metal}" stroke-width="3" opacity=".9">${plate.replace('<path', '<path fill="none"').replace('<circle', '<circle fill="none"').replace('<ellipse', '<ellipse fill="none"')}</g>
      ${rivets}</g></svg>`;
}

let timers = [];
function renderReveal() {
  const c = compose(S.ranked, S.topic); S.badge = c; save();
  const v = document.createElement('div');
  v.className = 'vault';
  v.innerHTML = `<button class="skip" data-act="skip">Skip</button>
    <div class="stage">
      <div class="badge-wrap">${badgeSVG(c)}</div>
      <div class="inscription">${[...c.inscription].map(ch => `<span class="ch">${esc(ch)}</span>`).join('')}</div>
      <div class="after"><button class="btn ghost" data-act="replay">Replay</button><button class="btn" data-act="done">Your Ten</button></div>
    </div>`;
  document.body.appendChild(v);
  setBackgroundInert(true);
  announce(`Badge revealed. Inscription: ${c.inscription}`);
  runReveal(v);
}
function runReveal(v) {
  const at = (ms, fn) => timers.push(setTimeout(fn, reduced() ? 0 : ms));
  timers.forEach(clearTimeout); timers = [];
  requestAnimationFrame(() => v.classList.add('in'));
  at(300, () => $('#l-plate', v).classList.add('on'));
  at(900, () => $('#l-motif', v).classList.add('on'));
  at(1400, () => $('#l-metal', v).classList.add('on'));
  at(800, () => $('.skip', v).classList.add('on'));
  at(1900, () => {
    const chs = $$('.inscription .ch', v);
    const step = Math.min(45, 700 / Math.max(chs.length, 1));
    chs.forEach((ch, i) => at(i * step, () => ch.classList.add('on')));
    at(chs.length * step + 240, () => $('.after', v).classList.add('on'));
  });
}
function skipReveal(v) {
  timers.forEach(clearTimeout); timers = [];
  v.classList.add('in');
  $$('.layer', v).forEach(l => l.classList.add('on'));
  $$('.inscription .ch', v).forEach(ch => ch.classList.add('on'));
  $('.after', v).classList.add('on'); $('.skip', v).classList.remove('on');
}

/* The other domains, in Mischa's order. The ones that are not built say so
   rather than being hidden: a picker that shows only what exists tells the
   user the app is smaller than it is going to be. */
function otherDomains() {
  const doneDomains = new Set((S.done || []).map(d => d.domain));
  return DOMAINS.filter(d => d.id !== domainOf(S.topic)).map(d => {
    if (!d.ready) return `<button class="sug-topic" data-act="notyet" data-label="${esc(d.label)}" style="opacity:.55">
      <div class="lvl">Coming next</div><div class="t">${esc(d.label)}</div>
      <div class="why">The flow is the same; this collection is not built yet.</div></button>`;
    const already = doneDomains.has(d.id);
    return `<button class="sug-topic" data-topic='${esc(JSON.stringify(d.topic))}'>
      <div class="lvl">${already ? 'Another one' : 'A new kind of list'}</div>
      <div class="t">Your top ten ${esc(d.noun)}</div>
      <div class="why">${already ? 'You have done one of these. Do another.' : 'Same ten slots, a different collection.'}</div></button>`;
  }).join('');
}

function topicId(t) {
  if (t.director) return `${domainOf(t)}:director:${t.director}`;
  if (t.actor) return `${domainOf(t)}:actor:${t.actor}`;
  if (t.genre && t.decade) return `${domainOf(t)}:genre:${t.genre}:${t.decade}`;
  if (t.genre) return `${domainOf(t)}:genre:${t.genre}`;
  if (t.decade) return `${domainOf(t)}:decade:${t.decade}`;
  return t.id || domainOf(t);
}

function rabbitHole() {
  const F = facts(S.ranked), out = [];
  const [g, gn] = F.genre, [d, dn] = F.director, [dec, decn] = F.decade;
  const N = nounFor(S.topic), N1 = domainMeta(S.topic).one;
  if (d && dn >= 2) out.push({ level: 'Very specific', title: `${d} ${N}`, director: d, prompt: `Your 10 favorite ${d} ${N}.`, why: `${dn} of your ten are ${d}. Prove it.` });
  const actorCounts = {};
  for (const f of F.films) for (const a of (f.ca || [])) actorCounts[a] = (actorCounts[a] || 0) + 1;
  const [actor, an] = Object.entries(actorCounts).sort((a, b) => b[1] - a[1])[0] || [null, 0];
  if (actor && an >= 2) out.push({ level: 'Very specific', title: `${actor} ${N}`, actor, prompt: `Your 10 favorite ${actor} ${N}.`, why: `${actor} turns up ${an} times in your ten.` });
  if (g && dec) out.push({ level: 'Very specific', title: `${g} of the ${dec}s`, genre: g, decade: dec, prompt: `Your 10 favorite ${g.toLowerCase()} ${N} of the ${dec}s.`, why: 'You keep going back to one decade.' });
  if (g) out.push({ level: 'Specific', title: `${g} ${N}`, genre: g, prompt: `Your 10 favorite ${g.toLowerCase()} ${N}.`, why: `${gn} of your ten are ${g.toLowerCase()}. Commit.` });
  const present = new Set(F.films.flatMap(f => f.g));
  const absent = Object.keys(MOTIFS).find(x => !present.has(x) && CAT.filter(f => f.g.includes(x)).length > 12);
  if (absent) out.push({ level: 'Specific', title: `${absent} ${N}`, genre: absent, prompt: `Your 10 favorite ${absent.toLowerCase()} ${N}.`, why: `Not one ${absent.toLowerCase()} ${N1} made your ten. Suspicious.` });
  if (dec) out.push({ level: 'Broad', title: `The ${dec}s`, decade: dec, prompt: `Your 10 favorite ${N} of the ${dec}s.`, why: `${decn} of your ten came from the ${dec}s.` });
  out.push({ level: 'Broad', title: `${domainMeta(S.topic).label}, again`, prompt: `Your 10 favorite ${N} of all time.`, why: 'Taste moves. Re-rank from scratch and see.' });
  // Stable ids and a domain on every generated topic: the reveal gate asks
  // "have you made a take on THIS topic", which needs the same topic to have
  // the same name twice.
  return out.slice(0, 6).map(t => ({ ...t, domain: domainOf(S.topic), id: topicId({ ...t, domain: domainOf(S.topic) }) }));
}

/* ── Routing ──────────────────────────────────────────────────────────────── */
function setBackgroundInert(on) {
  for (const el of [app, dockEl]) { el.inert = on; if (on) el.setAttribute('aria-hidden', 'true'); else el.removeAttribute('aria-hidden'); }
}
function render() {
  $$('.vault').forEach(v => v.remove());
  closeMap();
  setBackgroundInert(false);
  if (S.scene === 'intro') renderIntro();
  else if (S.scene === 'discover') renderDiscover();
  else if (S.scene === 'other') renderOther(S.other);
  else if (S.scene === 'build') renderBuild();
  else if (S.scene === 'cut') renderCut();
  else if (S.scene === 'rank') { if (!S.rank) startDuel(); else renderDuel(); }
  else if (S.scene === 'reveal') renderReveal();
  else if (S.scene === 'done') renderFinished();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-deeper],[data-remove],[data-move],[data-toggle],[data-toggle-service],[data-facet],[data-facetjump],[data-higher],[data-sheet],[data-clear],[data-act],[data-topic],[data-focusnode],[data-dropfocus],[data-mapnode],[data-other]');
  if (!t) return;

  if (t.dataset.clear) { e.stopPropagation(); const k = t.dataset.clear; S.filters[k] = k === 'services' ? [] : null; save(); renderBuild(); return; }
  if (t.dataset.add) { addFilm(+t.dataset.add, t); return; }
  if (t.dataset.deeper) {
    const id = +t.dataset.deeper;
    follow(id); S.q = ''; renderBuild();
    window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
    announce(`Showing ${nounFor()} like ${byId.get(id).t}`); return;
  }
  if (t.dataset.facetjump) {
    const { kind, value } = JSON.parse(t.dataset.facetjump);
    S.filters[kind] = S.filters[kind] === value ? null : value;
    save(); renderBuild();
    announce(S.filters[kind] ? `Narrowed to ${value}` : `${value} filter removed`); return;
  }
  if (t.dataset.focusnode) { S.graph.focus = +t.dataset.focusnode; save(); renderBuild(); return; }
  if (t.dataset.dropfocus) {
    // Stepping out of a branch moves focus to its parent and keeps every node
    // that was ever explored — the map still holds the way back.
    const n = node(+t.dataset.dropfocus);
    S.graph.focus = n ? n.parent : null; save(); renderBuild(); return;
  }
  if (t.dataset.other) { S.other = t.dataset.other; S.scene = 'other'; save(); render(); return; }
  if (t.dataset.mapnode) {
    if (t.dataset.mapnode === 'home') { S.graph.focus = null; save(); closeMap(); renderBuild(); return; }
    const id = +t.dataset.mapnode;
    if (t.dataset.mapghost) {
      // Walking the map: following an unexplored step stays in the map, so a
      // path can be built here rather than only reviewed here.
      follow(id); renderBuild(); closeMap(); renderMap();
      announce(`Following ${byId.get(id).t}`); return;
    }
    S.graph.focus = id; save(); closeMap(); renderBuild(); return;
  }
  if (t.dataset.trailto !== undefined) { S.branch = S.branch.slice(0, +t.dataset.trailto + 1); save(); renderBuild(); return; }
  if (t.dataset.remove) { removeFilm(+t.dataset.remove); refreshTenSheet(); return; }
  if (t.dataset.move) {
    const id = +t.dataset.move, dir = +t.dataset.dir, i = S.tray.indexOf(id), j = i + dir;
    if (j >= 0 && j < S.tray.length) { S.tray.splice(j, 0, S.tray.splice(i, 1)[0]); save(); refreshTenSheet();
      announce(`${byId.get(id).t} moved to ${j + 1}`); }
    return;
  }
  if (t.dataset.toggleService) {
    const id = t.dataset.toggleService, on = S.filters.services.includes(id);
    S.filters.services = on ? S.filters.services.filter(x => x !== id) : [...S.filters.services, id];
    save(); openSheet('services'); return;
  }
  if (t.dataset.facet) {
    const k = t.dataset.facet, v = t.dataset.value;
    S.filters[k] = S.filters[k] === v ? null : v;
    save(); closeSheet(); renderBuild(); return;
  }
  if (t.dataset.sheet) { openSheet(t.dataset.sheet); return; }
  if (t.dataset.higher !== undefined) { answer(t.dataset.higher === '1'); return; }
  if (t.dataset.topic) { const done = S.done || []; S = fresh(JSON.parse(t.dataset.topic)); S.done = done; save(); render(); return; }

  switch (t.dataset.act) {
    case 'begin': S.scene = 'build'; save(); render(); break;
    case 'discover': S.scene = 'discover'; save(); render(); break;
    case 'backhome': S.scene = (S.done || []).length ? 'done' : 'build'; save(); render(); break;
    case 'notyet': announce(`${t.dataset.label} is not built yet`); break;
    case 'clearq': S.q = ''; save(); renderBuild(); break;
    case 'openten': case 'arrange': openSheet('ten'); break;
    case 'closesheet': closeSheet(); break;
    case 'duel': startDuel(); break;
    case 'finish': {
      closeSheet();
      S.ranked = S.tray.slice(0, 10);
      S.badge = compose(S.ranked, S.topic);
      S.done = [...(S.done || []).filter(d => d.topicId !== S.topic.id),
                { topicId: S.topic.id, title: S.topic.title, domain: domainOf(S.topic),
                  ranked: S.ranked.slice(), badge: S.badge }];
      S.scene = 'reveal'; save(); renderReveal(); break;
    }
    case 'cut': S.scene = 'cut'; S.keep = []; save(); renderCut(); break;
    case 'cutdone': S.tray = S.keep.slice(); S.scene = 'build'; save(); renderBuild(); openSheet('ten'); break;
    case 'openmap': renderMap(); break;
    case 'closemap': closeMap(); break;
    case 'skip': skipReveal(t.closest('.vault')); break;
    case 'replay': { const v = t.closest('.vault');
      $$('.layer', v).forEach(l => l.classList.remove('on'));
      $$('.inscription .ch', v).forEach(ch => ch.classList.remove('on'));
      $('.after', v).classList.remove('on'); $('.skip', v).classList.remove('on'); runReveal(v); break; }
    case 'done': t.closest('.vault').remove(); setBackgroundInert(false); S.scene = 'done'; save(); renderFinished(); break;
    case 'replayfull': S.scene = 'reveal'; save(); renderReveal(); break;
    case 'restart': { const done = S.done || []; S = fresh(); S.done = done; save(); render(); break; }
  }
});

// The Cut's keep toggles.
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]'); if (!t) return;
  const id = +t.dataset.toggle;
  if (S.keep.includes(id)) S.keep = S.keep.filter(x => x !== id);
  else if (S.keep.length < 10) S.keep.push(id);
  save(); renderCut();
});

// For the Playwright harness. A getter, not a snapshot — S is reassigned on
// restart and on entering a new topic, and a stale copy would make the tests
// assert against a state the app has already left.
Object.defineProperty(window, 'S', { get: () => S });
window.byId = byId; window.PEOPLE = PEOPLE;
window.theirTen = theirTen; window.listName = listName; window.listNameCandidates = listNameCandidates;
render();
</script>
</body>
</html>
