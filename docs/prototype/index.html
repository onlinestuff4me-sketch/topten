      <path class="key-check" d="M17 13.6 L19 15.6 L22 11.9"/></svg>`,
  next: `<svg width="24" height="34" viewBox="0 0 26 36" aria-hidden="true" focusable="false">
      <rect class="key-plate" x="3.5" y="10.5" width="19" height="24" rx="4"/>
      <path class="key-plus" d="M13 17 v11 M7.5 22.5 h11"/></svg>`,
};
const MAP_KEY = [
  ['here', 'You are here'],
  ['plain', 'Path you took'],
  ['ten', 'In your Ten'],
  ['next', 'Not explored yet'],
];
/* Only the states actually on screen. A key is a reading aid for what is
   drawn; a marker listed but absent sends the reader hunting for it. */
function mapKey(states) {
  const items = MAP_KEY.filter(([k]) => states.has(k));
  if (!items.length) return '';
  return `<ul class="map-key" aria-label="What the marks mean">${items
    .map(([k, label]) => `<li class="key-${k}">${KEY_SWATCH[k]}<span>${label}</span></li>`).join('')}</ul>`;
}

/* Nothing explored: a designed page, not an origin with speculative children.
   It says what the map records and what puts something on it, and it promises
   the thing the bug broke — that the map only ever draws your own path. */
const MAP_BLANK = `<div class="map-empty">
  <svg class="blank-art" width="188" height="106" viewBox="0 0 188 106" aria-hidden="true" focusable="false">
    <rect x="66" y="2" width="56" height="26" rx="8"/>
    <path d="M94 28 C94 48, 41 44, 41 62"/>
    <path d="M94 28 C94 48, 147 44, 147 62"/>
    <rect x="18" y="63" width="46" height="41" rx="8"/>
    <rect x="124" y="63" width="46" height="41" rx="8"/>
  </svg>
  <h3>Your map is empty</h3>
  <p>This is the record of where you have actually been. It draws your own path
     and nothing else, so it stays blank until you go somewhere.</p>
  <ul>
    <li><span class="m">+ Add</span><span>puts a film here the moment it joins your Ten.</span></li>
    <li><span class="m">Similar</span><span>follows a film, and the map keeps whatever led you to it — stepping back never erases a branch.</span></li>
  </ul>
  <p class="hint">Nothing on this map is ever a film you did not choose.</p>
</div>`;

// "You are here", as a shape. Sits above the plate, clear of every label.
const hereMark = (cx, top) => `<path class="map-here" d="M${cx - 7} ${top - 9} L${cx + 7} ${top - 9} L${cx} ${top - 2} Z"/>`;

/* Draw the explored graph. Returns the svg and the set of states it used, so
   the key can list exactly what is on screen. */
function drawMap(ghosts, focus) {
  const { placed, pos, width, height } = layoutMap(ghosts, focus);
  const at = new Map(placed.map(p => [p.id, pos(p)]));
  const states = new Set();

  const ghostSet = new Set(ghosts);
  const edges = placed.filter(p => p.id != null).map(p => {
    const n = node(p.id);
    const parentId = n ? (n.parent ?? null) : focus;
    const from = at.get(parentId), to = at.get(p.id);
    if (!from || !to) return '';
    // The origin's plate is shorter than a poster's, so its edges have to
    // leave from its own bottom rather than from a poster-sized assumption.
    const fromBottom = from.cy + (parentId == null ? MAP.originH : MAP.h) / 2;
    const toTop = to.cy - MAP.h / 2;
    const midY = (fromBottom + toTop) / 2;
    return `<path class="map-edge ${ghostSet.has(p.id) ? 'ghost' : ''}" d="M${from.cx} ${fromBottom} C${from.cx} ${midY}, ${to.cx} ${midY}, ${to.cx} ${toTop}"/>`;
  }).join('');

  const nodes = placed.map(p => {
    const c = at.get(p.id);
    if (p.id == null) {
      const isFocus = focus == null;
      if (isFocus) states.add('here');
      const top = c.cy - MAP.originH / 2;
      return `<g class="map-node ${isFocus ? 'focus' : ''}" data-mapnode="home" tabindex="0" role="button"
          aria-label="All of ${esc(S.topic.title)}${isFocus ? ', where you are' : ''}">
        ${isFocus ? hereMark(c.cx, top) : ''}
        <rect class="plate" x="${c.cx - MAP.w / 2}" y="${top}" width="${MAP.w}" height="${MAP.originH}" rx="10"/>
        <text x="${c.cx}" y="${c.cy + 4}" text-anchor="middle">${esc(mapLabel(S.topic.title))}</text></g>`;
    }
    const f = byId.get(p.id);
    if (!f) return '';                       // never let one unknown id blank the map
    const label = mapLabel(f.t), top = c.cy - MAP.h / 2 - 2;

    // A step you have not taken carries NO artwork. A poster is what a node
    // on this map means — "a film that is on your path" — so lending one to a
    // speculation is the map claiming a selection you never made.
    if (ghostSet.has(p.id) && !node(p.id)) {
      states.add('next');
      return `<g class="map-node ghost" data-mapnode="${p.id}" data-mapghost="1" tabindex="0" role="button"
          aria-label="${esc(f.t)}, not explored yet. Follow it to put it on your map.">
        <rect class="plate" x="${c.cx - MAP.w / 2 - 2}" y="${top}" width="${MAP.w + 4}" height="${MAP.h + 4}" rx="8"/>
        <path class="map-plus" d="M${c.cx} ${c.cy - 10} v20 M${c.cx - 10} ${c.cy} h20"/>
        <text x="${c.cx}" y="${c.cy + MAP.h / 2 + 14}" text-anchor="middle">${esc(label)}</text>
      </g>`;
    }

    const picked = S.tray.includes(p.id), isFocus = focus === p.id;
    states.add(picked ? 'ten' : 'plain');
    if (isFocus) states.add('here');
    return `<g class="map-node ${isFocus ? 'focus' : ''} ${picked ? 'picked' : ''}"
        data-mapnode="${p.id}" tabindex="0" role="button"
        aria-label="${esc(f.t)}${picked ? ', in your Ten' : ', followed'}${isFocus ? ', where you are' : ''}">
      ${isFocus ? hereMark(c.cx, top) : ''}
      <rect class="plate" x="${c.cx - MAP.w / 2 - 2}" y="${top}" width="${MAP.w + 4}" height="${MAP.h + 4}" rx="8"/>
      <image href="${IMG}w185${f.p}" x="${c.cx - MAP.w / 2}" y="${c.cy - MAP.h / 2}" width="${MAP.w}" height="${MAP.h}"
        preserveAspectRatio="xMidYMid slice" style="clip-path:inset(0 round 6px)"/>
      ${picked ? `<circle class="map-tick" cx="${c.cx + MAP.w / 2 - 4}" cy="${c.cy - MAP.h / 2 + 4}" r="8"/>
        <text x="${c.cx + MAP.w / 2 - 4}" y="${c.cy - MAP.h / 2 + 7}" text-anchor="middle" style="fill:#17140B;font-weight:800">✓</text>` : ''}
      <text x="${c.cx}" y="${c.cy + MAP.h / 2 + 14}" text-anchor="middle">${esc(label)}</text>
    </g>`;
  }).join('');

  return { states, svg: `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"
    role="group" aria-label="Your exploration map">${edges}${nodes}</svg>` };
}

function renderMap() {
  // A focus that no longer resolves to a node (a rebuilt shelf, a pruned
  // draft) is the origin, not a dangling id.
  const focus = node(S.graph.focus) ? S.graph.focus : null;
  const explored = S.graph.roots.some(r => node(r));
  const ghosts = explored ? ghostsFor(focus) : [];
  const drawn = explored ? drawMap(ghosts, focus) : null;

  const v = document.createElement('div');
  v.className = 'mapview';
  v.innerHTML = `
    <div class="map-head"><h2>Map of your selections</h2><button class="done" data-act="closemap">Done</button></div>
    ${mapContext()}
    ${drawn ? mapKey(drawn.states) : ''}
    <div class="map-scroll">${drawn ? drawn.svg : MAP_BLANK}</div>`;
  document.body.appendChild(v);
  setBackgroundInert(true);

  // Centre on where you are. A map that opens at its top-left corner drops
  // you in blank space the moment the graph is wider than the screen.
  // Measured deltas, not scrollIntoView — that does nothing for an SVG group
  // in Chromium — and run on a second frame too, because on the first the
  // scroller has not yet taken the SVG's width and the scroll clamps to zero.
  const centre = () => {
    const el = $('.map-node.focus', v), sc = $('.map-scroll', v);
    if (!el || !sc) return;
    const a = el.getBoundingClientRect(), b = sc.getBoundingClientRect();
    sc.scrollLeft += (a.left + a.width / 2) - (b.left + b.width / 2);
    sc.scrollTop += (a.top + a.height / 2) - (b.top + b.height / 2);
  };
  requestAnimationFrame(() => { centre(); requestAnimationFrame(centre); });
}
/* The map has to say what it is filtered by, or it looks like it has lost
   your context (round 3: "doesn't have accurate breadcrumbs"). */
function mapContext() {
  const F = S.filters, bits = [];
  if (F.services.length) bits.push('On ' + F.services.map(sid => (SERVICES.find(x => x[0] === sid) || [, sid])[1]).join(', '));
  for (const k of ['genre', 'director', 'actor']) if (F[k]) bits.push(F[k]);
  if (!bits.length) return '';
  // True of every state of this screen, including the empty one: a filter
  // changes what is offered next, never what the map has recorded.
  return `<p class="map-context">Filtered by <strong>${esc(bits.join(' · '))}</strong> — filters
    change what is offered next, never the path the map records.</p>`;
}

function closeMap() {
  $$('.mapview').forEach(v => v.remove());
  setBackgroundInert(false);
}

/* ── Intro ────────────────────────────────────────────────────────────────
   The artwork is chosen from the baked catalog, so this screen makes no API
   call of its own and cannot show a loading state — Stack's rule, and its
   reasoning holds harder here: this is the first screen, often on a cold
   cache, and a screen whose whole job is to look finished is the worst place
   in the app to wait for anything. */
/* Hand-picked, not whatever the shelf happens to rank highest — Stack keeps a
   curated `splashTitles` for exactly this reason. The first screen is a claim
   about what the app is for, and "widely known" is the property that matters
   there, not "well rated". Titles missing from the catalog are skipped rather
   than replaced by something arbitrary. */
const SPLASH = [
  'The Godfather', 'Pulp Fiction', 'Spirited Away', 'Jaws', 'Alien',
  'The Dark Knight', 'Parasite', 'GoodFellas', 'Blade Runner', 'Casablanca',
  'Interstellar', 'The Matrix', 'Toy Story', 'Jurassic Park', 'Whiplash',
  'Mad Max: Fury Road', 'The Shining', 'Back to the Future', 'Fight Club', 'Heat',
];
function introTiles(n, offset) {
  const byTitle = new Map(CAT.filter(f => f.dm === 'movie').map(f => [f.t, f]));
  const pool = SPLASH.map(t => byTitle.get(t)).filter(Boolean).slice(offset, offset + n);
  return pool.map((f, i) => `<div class="tile">
      <img src="${art(f)}" alt="" loading="eager" decoding="async">
      ${i % 4 === 0 ? `<span class="rank">${(i % 10) + 1}</span>` : ''}
    </div>`).join('');
}
function renderIntro() {
  const rowA = introTiles(10, 0), rowB = introTiles(10, 10);

/* ── Discover ─────────────────────────────────────────────────────────────
   Introduced after the second finished Ten (Mischa, 2026-08-15): by then the
   mechanic is understood and other people's lists are interesting rather than
   confusing. Earlier, they are just someone else's opinions about a thing you
   have not done yet.

   The badges here are LOCKED — PRD Req 12. You see the whole list; the badge
   is the part you earn by making your own take on the same topic, and it
   unlocks retroactively for every take on that topic at once.

   Two of these seven share a topic (Sam and Theo, both on Crime). That is not
   filler: Req 12 promises a take unlocks EVERY list on that topic at once, and
   with one list per topic that promise is unobservable and untestable. */
const PEOPLE = [
  { name: 'Sam', crit: { genre: 'Crime', decade: 1990 } },
  { name: 'Priya', crit: { genre: 'Science Fiction' } },
  { name: 'Marcus', crit: { genre: 'Animation', decade: 2000 } },
  { name: 'Nour', crit: { director: 'Alfred Hitchcock' } },
  { name: 'Theo', crit: { genre: 'Crime', decade: 1990 } },
  { name: 'Eddie', crit: { actor: 'Al Pacino' } },
  { name: 'Rae', crit: { domain: 'tv', genre: 'Drama' } },

/* ── Naming a list: the name IS the criteria ──────────────────────────────
   Corrected 2026-08-15 (Mischa), replacing a namer that read the ten and made
   a claim about them. A list is named by the rule that every one of its ten
   entries satisfies — "Top 10 Crime Movies of the 90s" — never by a fact that
   is merely true of some of them. The two are easy to confuse and the
   difference is the whole thing:

     a NAME is a rule, true of 10 out of 10, because the rule is exactly what
       filtered the shelf the list was built from (`inTopic`)
     a REASON is a fraction, true of 4 out of 10, and it is why we offer you a
       list you have not made yet

   So "4 of your 10 were crime movies from the 1990s" is the reason the app
   suggests the Crime-90s list. It is not what that list is called, and the
   list it leads to holds ten crime movies from the 1990s, not four.

   Nobody types a name (PRD Req 12 amendment): free text on a social surface is
   a moderation surface this product does not need. Foundation Models still has
   the job named in prd.md Req 5 — choosing WHICH criteria are worth offering,
   and shortening a name the way a person would. It never writes one, because a
   written name can be false. Below is the floor that runs without the model. */

// "Alfred Hitchcock" -> Hitchcock, because that is the list people ask for.
// Only when the collection holds exactly one person with that surname:
// "Murphy" is Eddie, Cillian and Ryan, so Eddie Murphy stays whole.
// A particle belongs to the name it precedes: "Robert De Niro" is a De Niro,
// not a Niro, and "Vincent van Gogh" is a van Gogh.
const PARTICLES = new Set(['de', 'del', 'della', 'der', 'di', 'du', 'da', 'das', 'do', 'dos',
  'la', 'le', 'van', 'von', 'ter', 'ten', 'bin', 'al', 'st.']);
function familyName(full) {
  const parts = String(full).split(/\s+/).filter(Boolean);
  if (parts.length < 2) return null;
  let i = parts.length - 1;
  while (i > 1 && PARTICLES.has(parts[i - 1].toLowerCase())) i--;
  return parts.slice(i).join(' ');
}
let _surnames = null;
function surnameIndex() {
  if (_surnames) return _surnames;
  _surnames = new Map();
  for (const f of CAT) for (const p of [f.d, ...(f.ca || [])]) {
    if (!p) continue;
    const s = familyName(p);
    // A short tail is the second half of a given name ("Bong Joon Ho"), not a
    // surname anyone would use on its own.
    if (!s || s.length <= 3) continue;
    if (!_surnames.has(s)) _surnames.set(s, new Set());
    _surnames.get(s).add(p);

}

/* Some genres are already the plural noun for the thing itself — a person says
   "Eddie Murphy comedies", not "Eddie Murphy comedy movies". The rest are
   adjectives and take the domain's own noun after them: "Crime Movies". Only

   Comedies" on the TV shelf, both read as films. */
const GENRE_HEAD = { Comedy: 'Comedies', Thriller: 'Thrillers', Drama: 'Dramas',
  Documentary: 'Documentaries', Western: 'Westerns', Mystery: 'Mysteries', Romance: 'Romances' };
const GENRE_ADJ = { 'Science Fiction': 'Sci-Fi', 'Sci-Fi & Fantasy': 'Sci-Fi',

const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);

// above it call the same thing the same thing.
const genreWord = g => String(GENRE_ADJ[g] || g).toLowerCase();

const genrePhrase = (g, t = S.topic) => {

// sentence in two registers, so they cannot drift into describing different

function nameParts(t) {
  const meta = DOMAINS.find(d => d.id === domainOf(t)) || DOMAINS[0];
  const head = (meta.id === 'movie' && t.genre && GENRE_HEAD[t.genre]) || null;
  const bare = !t.genre && !t.director && !t.actor && !t.decade;
  return {
    person: t.director || t.actor || null,
    adj: head ? null : (t.genre ? (GENRE_ADJ[t.genre] || t.genre) : null),
    head: head || cap(meta.noun),
    tail: t.decade ? ` of the ${decadeName(t.decade)}` : bare ? ' of All Time' : '',

}

  const p = nameParts(t);

}
function topicPrompt(t) {
  const p = nameParts(t);

// Criteria in, a whole topic out: named, phrased and identified in one place,

function makeTopic(criteria) {

}

const TEN = 10;
const supply = t => CAT.filter(f => inTopic(f, t)).length;

// The one place a list's displayed name comes from. There is nothing left to
// derive: a list's name is its topic's name.
function listName(films, topic) { return (topic && topic.title) || topicTitle(topic || {}); }

// The three built domains name their all-time list through the same function
// as everything else, rather than carrying a hand-written title that could
// disagree with it.
for (const d of DOMAINS) if (d.topic) {
  d.topic.title = topicTitle(d.topic);
  d.topic.prompt = topicPrompt(d.topic);
}
// The fixture people get their topics from the same function too. Assigned
// here rather than at the declaration because the namer's tables are consts

for (const p of PEOPLE) p.topic = makeTopic(p.crit);

const lockedBadge = (big) => `<svg class="lockedbadge${big ? ' big' : ''}" viewBox="0 0 44 44"
  role="img" aria-label="Badge, locked">
  <rect class="plate" x="1" y="1" width="42" height="42" rx="11"/>
  <path class="shackle" d="M16.5 21v-4a5.5 5.5 0 0 1 11 0v4"/>
  <rect class="body" x="13" y="20.5" width="18" height="13.5" rx="3.5"/>

// Their ten is drawn from the criteria their list is named for, so the name is

function theirTen(person) {
  const dm = person.topic.domain;
  const seed = hash(person.name + dm);
  const shelf = CAT.filter(f => inTopic(f, person.topic));
  const ranked = shelf
    .map((f, i) => [((hash(f.t + person.name) % 1000) / 1000) + f.v, f])
    .sort((a, b) => b[0] - a[0]).slice(0, 10).map(x => x[1]);
  return { person, dm, ranked, seed };
}

// Every topic you have finished. A locked badge opens the moment you have a
// take on its topic — and every other badge on that topic opens with it.
const unlockedTopics = () => new Set((S.done || []).map(d => d.topicId));

/* ── Optional guided ranking ──────────────────────────────────────────────── */
function startDuel() {
  const items = S.tray.slice(0, 10);
  const order = items.slice();
  S.ranked = [order[0]];
  S.rank = { queue: order.slice(1), current: null, lo: 0, hi: 1 };
  S.comparisons = 0; S.scene = 'rank';
  closeSheet(); nextPlacement();
}
function nextPlacement() {
  const r = S.rank;

    r.current = r.queue.shift(); r.lo = 0; r.hi = S.ranked.length;
  }
  if (r.lo >= r.hi) {
    S.ranked.splice(r.lo, 0, r.current); r.current = null; save();
    if (!r.queue.length) return endDuel();

  Animation: 'star', Drama: 'mask', Comedy: 'grin', War: 'helm', Adventure: 'compass', Action: 'flame',
  Fantasy: 'sword', Music: 'note', History: 'column', Western: 'sun', Family: 'star', Mystery: 'eye', Documentary: 'column',
  Gothic: 'skull', Historical: 'column', Philosophy: 'column', Religion: 'column', Poetry: 'note',
  Mythology: 'sword', Dystopia: 'eye', Satire: 'grin', Biography: 'mask', 'Short Stories': 'star',
  Nonfiction: 'column', Science: 'planet', Politics: 'column', Travel: 'compass' };

function facts(ids) {
  const fs = ids.map(i => byId.get(i)).filter(Boolean);
  const gc = {}, dc = {}, dec = {};
  for (const f of fs) {
    for (const g of f.g) if (g) gc[g] = (gc[g] || 0) + 1;
    if (f.d) dc[f.d] = (dc[f.d] || 0) + 1;
    const d = Math.floor(f.y / 10) * 10; dec[d] = (dec[d] || 0) + 1;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0] || [null, 0];
  // A decade is a number everywhere it is used — as a key it came back a
  // string, and `inTopic` compares decades with !==, so "1990" matched nothing.
  const topDec = top(dec), years = fs.map(f => f.y);

  // survives.

  if (gn >= 4) c.push(`${gn} ${g.toLowerCase()} ${N}, zero regrets`);

    compass: `<circle cx="100" cy="100" r="38" fill="none" stroke-width="7"/><path d="M100 74 L112 100 L100 126 L88 100 Z"/>`,
    flame: `<path d="M100 60 c16 22 30 30 30 50 a30 30 0 0 1-60 0c0-14 10-20 16-30 4 10 10 12 14 6 4-8-2-16 0-26z"/>`,
    sword: `<rect x="94" y="58" width="12" height="70"/><rect x="74" y="126" width="52" height="10" rx="4"/><rect x="94" y="136" width="12" height="16"/>`,
    note: `<circle cx="84" cy="128" r="15"/><rect x="96" y="62" width="9" height="66"/><path d="M105 62 q22 6 22 22" fill="none" stroke-width="8"/>`,
    column: `<rect x="76" y="76" width="48" height="8"/><rect x="82" y="84" width="10" height="46"/><rect x="108" y="84" width="10" height="46"/><rect x="72" y="130" width="56" height="9"/>`,
    sun: `<circle cx="100" cy="100" r="22"/>` + Array.from({ length: 8 }, (_, i) => `<rect x="97" y="52" width="6" height="16" transform="rotate(${i * 45} 100 100)"/>`).join(''),
    laurel: `<path d="M100 60 v78" stroke-width="6" fill="none"/>`
  }[c.motif] || '';
  const rivets = Array.from({ length: 8 }, (_, i) => {
    const a = (i / 8) * Math.PI * 2, R = half - 22;
    return `<circle cx="${(half + Math.cos(a) * R).toFixed(1)}" cy="${(half + Math.sin(a) * R).toFixed(1)}" r="3" fill="${c.metal}" opacity=".85"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${s} ${s}" role="img" aria-label="Badge: ${esc(c.inscription)}">
    <defs><linearGradient id="f${c.seed}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c.primary}"/><stop offset="100%" stop-color="${c.secondary}"/></linearGradient></defs>
    <g class="layer" id="l-plate" fill="url(#f${c.seed})">${plate}</g>
    <g class="layer" id="l-motif" fill="${c.metal}" stroke="${c.metal}" opacity=".95">${M}</g>
    <g class="layer" id="l-metal" fill="none">
      <g stroke="${c.metal}" stroke-width="3" opacity=".9">${plate.replace('<path', '<path fill="none"').replace('<circle', '<circle fill="none"').replace('<ellipse', '<ellipse fill="none"')}</g>
      ${rivets}</g></svg>`;
}

let timers = [];
function renderReveal() {
  const c = compose(S.ranked, S.topic); S.badge = c; save();
  const v = document.createElement('div');
  v.className = 'vault';
  v.innerHTML = `<button class="skip" data-act="skip">Skip</button>
    <div class="stage">
      <div class="badge-wrap">${badgeSVG(c)}</div>
      <div class="inscription">${[...c.inscription].map(ch => `<span class="ch">${esc(ch)}</span>`).join('')}</div>
      <div class="after"><button class="btn ghost" data-act="replay">Replay</button><button class="btn" data-act="done">Your Ten</button></div>
    </div>`;
  document.body.appendChild(v);
  setBackgroundInert(true);
  announce(`Badge revealed. Inscription: ${c.inscription}`);
  runReveal(v);
}
function runReveal(v) {
  const at = (ms, fn) => timers.push(setTimeout(fn, reduced() ? 0 : ms));
  timers.forEach(clearTimeout); timers = [];
  requestAnimationFrame(() => v.classList.add('in'));
  at(300, () => $('#l-plate', v).classList.add('on'));
  at(900, () => $('#l-motif', v).classList.add('on'));
  at(1400, () => $('#l-metal', v).classList.add('on'));
  at(800, () => $('.skip', v).classList.add('on'));
  at(1900, () => {
    const chs = $$('.inscription .ch', v);
    const step = Math.min(45, 700 / Math.max(chs.length, 1));
    chs.forEach((ch, i) => at(i * step, () => ch.classList.add('on')));
    at(chs.length * step + 240, () => $('.after', v).classList.add('on'));
  });
}
function skipReveal(v) {
  timers.forEach(clearTimeout); timers = [];
  v.classList.add('in');
  $$('.layer', v).forEach(l => l.classList.add('on'));
  $$('.inscription .ch', v).forEach(ch => ch.classList.add('on'));
  $('.after', v).classList.add('on'); $('.skip', v).classList.remove('on');
}

function renderFinished() {
  const c = S.badge || compose(S.ranked, S.topic);
  app.innerHTML = `
    <div class="finished-head">
      <div class="badge-inline">${badgeSVG(c).replace(/class="layer"/g, 'class="layer on"')}</div>
      <h1 class="display-lg">${esc(S.topic.title)}</h1>
      <div class="insc">${esc(c.inscription)}</div>
    </div>
    <section><ol>${S.ranked.map((id, i) => { const f = byId.get(id); return `<li><div class="tenrow ${i === 0 ? 'one' : ''}">
      <span class="num">${i + 1}</span><span class="thumb"><img src="${art(f)}" alt=""></span>
      <span class="meta"><span class="t">${esc(f.t)}</span><span class="s">${f.y}${f.d ? ' · ' + esc(f.d) : ''}</span></span>
    </div></li>`; }).join('')}</ol></section>
    <section>
      <div class="section-head"><h2 class="section-h">More ${esc(nounFor(S.topic))}, closer in</h2></div>
      ${rabbitHole().map(t => `<button class="sug-topic" data-topic='${esc(JSON.stringify(t))}'>
        <div class="lvl">${t.level}</div><div class="t">${esc(t.title)}</div><div class="why">${esc(t.why)}</div></button>`).join('')}
    </section>

    <section>
      <div class="section-head"><h2 class="section-h">Or a different kind of list</h2></div>
      ${otherDomains()}
    </section>

    ${(S.done || []).length >= 2 ? `<section>
      <div class="section-head"><h2 class="section-h">What everyone else picked</h2></div>
      <p class="prompt" style="margin:0 0 var(--s3)">That is ${(S.done || []).length} of your own. Now the interesting part — other people's, and where you disagree.</p>
      <button class="btn" data-act="discover">See other people's Top 10 lists</button>
    </section>` : ''}
    <section style="display:flex;gap:var(--s2)">
      <button class="btn ghost" data-act="replayfull">Watch the reveal again</button>
      <button class="btn ghost" data-act="restart">Start over</button>
    </section>
    ${notes()}`;
  dockEl.innerHTML = '';
}
/* The other domains, in Mischa's order. The ones that are not built say so
   rather than being hidden: a picker that shows only what exists tells the
   user the app is smaller than it is going to be. */
function otherDomains() {
  const doneDomains = new Set((S.done || []).map(d => d.domain));
  return DOMAINS.filter(d => d.id !== domainOf(S.topic)).map(d => {
    if (!d.ready) return `<button class="sug-topic" data-act="notyet" data-label="${esc(d.label)}" style="opacity:.55">
      <div class="lvl">Coming next</div><div class="t">${esc(d.label)}</div>
      <div class="why">The flow is the same; this collection is not built yet.</div></button>`;
    const already = doneDomains.has(d.id);
    return `<button class="sug-topic" data-topic='${esc(JSON.stringify(d.topic))}'>
      <div class="lvl">${already ? 'Another one' : 'A new kind of list'}</div>
      <div class="t">${esc(d.topic.title)}</div>
      <div class="why">${already ? 'You have done one of these. Do another.' : 'Same ten slots, a different collection.'}</div></button>`;
  }).join('');
}

function topicId(t) {
  if (t.director) return `${domainOf(t)}:director:${t.director}`;
  if (t.actor) return `${domainOf(t)}:actor:${t.actor}`;
  if (t.genre && t.decade) return `${domainOf(t)}:genre:${t.genre}:${t.decade}`;
  if (t.genre) return `${domainOf(t)}:genre:${t.genre}`;
  if (t.decade) return `${domainOf(t)}:decade:${t.decade}`;
  return t.id || domainOf(t);
}

/* Every card here is a pair: criteria we will name the new list by, and the
   fraction of the user's OWN ten that suggested those criteria. The fraction
   is the reason, never the name (Mischa, 2026-08-15) — the card reads

     Top 10 Crime Movies of the 90s
     4 of your 10 were crime movies from the 90s.

   and the list it opens holds ten of them. Which is why every candidate is put
   through `offerable` before it is shown: naming a list by a rule is a promise
   that ten things satisfy the rule, and offering one the collection cannot
   fill would break that promise on the very next screen. */
function rabbitHole() {
  const F = facts(S.ranked), out = [];
  const [g, gn] = F.genre, [d, dn] = F.director, [dec, decn] = F.decade;
  const dm = domainOf(S.topic), N = nounFor(S.topic), N1 = domainMeta(S.topic).one;
  const add = (level, crit, why) => out.push({ level, crit: { ...crit, domain: dm }, why });
  const count = pred => F.films.filter(pred).length;
  const inDec = f => Math.floor(f.y / 10) * 10 === dec;

  if (g && dec) add('Very specific', { genre: g, decade: dec },
    `${count(f => f.g.includes(g) && inDec(f))} of your 10 were ${genreWord(g)} ${N} from the ${decadeName(dec)}.`);
  // "By" covers a director and an author both, which a domain-specific verb
  // would not — books have no directors and movies have no authors.
  if (d && dn >= 2) add('Very specific', { director: d }, `${dn} of your 10 were by ${d}.`);
  const actorCounts = {};
  for (const f of F.films) for (const a of (f.ca || [])) actorCounts[a] = (actorCounts[a] || 0) + 1;
  const [actor, an] = Object.entries(actorCounts).sort((a, b) => b[1] - a[1])[0] || [null, 0];
  if (actor && an >= 2) add('Very specific', { actor }, `${an} of your 10 starred ${actor}.`);
  if (g) add('Specific', { genre: g }, gn >= 10
    ? `All 10 of your 10 were ${genreWord(g)} ${N}. Make it official.`
    : `${gn} of your 10 were ${genreWord(g)} ${N}. Commit.`);
  const present = new Set(F.films.flatMap(f => f.g));
  const absent = Object.keys(MOTIFS).find(x => !present.has(x) && CAT.filter(f => f.g.includes(x)).length > 12);
  if (absent) add('Specific', { genre: absent },
    `Not one ${genreWord(absent)} ${N1} made your 10. Suspicious.`);
  if (dec) add('Broad', { decade: dec }, `${decn} of your 10 came from the ${decadeName(dec)}.`);
  add('Broad', {}, 'Taste moves. Re-rank from scratch and see.');

  const seen = new Set([S.topic.id]);
  const offers = [];
  for (const o of out) {
    const t = { ...makeTopic(o.crit), level: o.level, why: o.why };
    if (seen.has(t.id) || !offerable(t)) continue;
    seen.add(t.id); offers.push(t);
    if (offers.length === 6) break;
  }
  return offers;
}

/* ── Routing ──────────────────────────────────────────────────────────────── */
function setBackgroundInert(on) {
  for (const el of [app, dockEl]) { el.inert = on; if (on) el.setAttribute('aria-hidden', 'true'); else el.removeAttribute('aria-hidden'); }
}
function render() {
  $$('.vault').forEach(v => v.remove());
  closeMap();
  setBackgroundInert(false);
  if (S.scene === 'intro') renderIntro();
  else if (S.scene === 'discover') renderDiscover();
  else if (S.scene === 'other') renderOther(S.other);
  else if (S.scene === 'build') renderBuild();
  else if (S.scene === 'cut') renderCut();
  else if (S.scene === 'rank') { if (!S.rank) startDuel(); else renderDuel(); }
  else if (S.scene === 'reveal') renderReveal();
  else if (S.scene === 'done') renderFinished();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-deeper],[data-remove],[data-move],[data-toggle],[data-toggle-service],[data-facet],[data-facetjump],[data-higher],[data-sheet],[data-clear],[data-act],[data-topic],[data-focusnode],[data-dropfocus],[data-mapnode],[data-other]');
  if (!t) return;

  if (t.dataset.clear) { e.stopPropagation(); const k = t.dataset.clear; S.filters[k] = k === 'services' ? [] : null; save(); renderBuild(); return; }
  if (t.dataset.add) { addFilm(+t.dataset.add, t); return; }
  if (t.dataset.deeper) {
    const id = +t.dataset.deeper;
    follow(id); S.q = ''; renderBuild();
    window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
    announce(`Showing ${nounFor()} like ${byId.get(id).t}`); return;
  }
  if (t.dataset.facetjump) {
    const { kind, value } = JSON.parse(t.dataset.facetjump);
    S.filters[kind] = S.filters[kind] === value ? null : value;
    save(); renderBuild();
    announce(S.filters[kind] ? `Narrowed to ${value}` : `${value} filter removed`); return;
  }
  if (t.dataset.focusnode) { S.graph.focus = +t.dataset.focusnode; save(); renderBuild(); return; }
  if (t.dataset.dropfocus) {
    // Stepping out of a branch moves focus to its parent and keeps every node
    // that was ever explored — the map still holds the way back.
    const n = node(+t.dataset.dropfocus);
    S.graph.focus = n ? n.parent : null; save(); renderBuild(); return;
  }
  if (t.dataset.other) { S.other = t.dataset.other; S.scene = 'other'; save(); render(); return; }
  if (t.dataset.mapnode) {
    if (t.dataset.mapnode === 'home') { S.graph.focus = null; save(); closeMap(); renderBuild(); return; }
    const id = +t.dataset.mapnode;
    if (t.dataset.mapghost) {
      // Walking the map: following an unexplored step stays in the map, so a
      // path can be built here rather than only reviewed here.
      follow(id); renderBuild(); closeMap(); renderMap();
      announce(`Following ${byId.get(id).t}`); return;
    }
    S.graph.focus = id; save(); closeMap(); renderBuild(); return;
  }
  if (t.dataset.trailto !== undefined) { S.branch = S.branch.slice(0, +t.dataset.trailto + 1); save(); renderBuild(); return; }
  if (t.dataset.remove) { removeFilm(+t.dataset.remove); refreshTenSheet(); return; }
  if (t.dataset.move) {
    const id = +t.dataset.move, dir = +t.dataset.dir, i = S.tray.indexOf(id), j = i + dir;
    if (j >= 0 && j < S.tray.length) { S.tray.splice(j, 0, S.tray.splice(i, 1)[0]); save(); refreshTenSheet();
      announce(`${byId.get(id).t} moved to ${j + 1}`); }
    return;
  }
  if (t.dataset.toggleService) {
    const id = t.dataset.toggleService, on = S.filters.services.includes(id);
    S.filters.services = on ? S.filters.services.filter(x => x !== id) : [...S.filters.services, id];
    save();
    // Toggle the chip WHERE IT IS. This used to call openSheet('services'),
    // which replaced the sheet's markup wholesale — so the new element entered
    // from its off state and the whole sheet appeared to drop away and come
    // back on every tap (Mischa: "a weird jitter"). Nothing about picking a
    // service asks the sheet to move.
    t.classList.toggle('on', !on);
    t.setAttribute('aria-pressed', String(!on));
    announce(`${t.textContent.trim()} ${!on ? 'selected' : 'deselected'}`);
    return;
  }
  if (t.dataset.facet) {
    const k = t.dataset.facet, v = t.dataset.value;
    S.filters[k] = S.filters[k] === v ? null : v;
    save(); closeSheet(); renderBuild(); return;
  }
  if (t.dataset.sheet) { openSheet(t.dataset.sheet); return; }
  if (t.dataset.higher !== undefined) { answer(t.dataset.higher === '1'); return; }
  if (t.dataset.topic) {
    const done = S.done || [], tipDone = !!S.tipDone;
    S = fresh(JSON.parse(t.dataset.topic));
    S.done = done; S.tipDone = tipDone; save(); render(); return;
  }

  switch (t.dataset.act) {
    case 'begin': S.scene = 'build'; save(); render(); break;
    case 'discover': S.scene = 'discover'; save(); render(); break;
    case 'backhome': S.scene = (S.done || []).length ? 'done' : 'build'; save(); render(); break;
    case 'notyet': announce(`${t.dataset.label} is not built yet`); break;
    case 'clearq': S.q = ''; save(); renderBuild(); break;
    case 'tipdone': S.tipDone = true; save(); renderBuild(); break;
    case 'openten': case 'arrange': openSheet('ten'); break;
    case 'closesheet': closeSheet(); break;
    case 'duel': startDuel(); break;
    case 'finish': {
      closeSheet();
      S.ranked = S.tray.slice(0, 10);
      S.badge = compose(S.ranked, S.topic);
      S.done = [...(S.done || []).filter(d => d.topicId !== S.topic.id),
                { topicId: S.topic.id, title: S.topic.title, domain: domainOf(S.topic),
                  ranked: S.ranked.slice(), badge: S.badge }];
      S.scene = 'reveal'; save(); renderReveal(); break;
    }
    case 'cut': S.scene = 'cut'; S.keep = []; save(); renderCut(); break;
    case 'cutdone': S.tray = S.keep.slice(); S.scene = 'build'; save(); renderBuild(); openSheet('ten'); break;
    case 'openmap': renderMap(); break;
    case 'closemap': closeMap(); break;
    case 'skip': skipReveal(t.closest('.vault')); break;
    case 'replay': { const v = t.closest('.vault');
      $$('.layer', v).forEach(l => l.classList.remove('on'));
      $$('.inscription .ch', v).forEach(ch => ch.classList.remove('on'));
      $('.after', v).classList.remove('on'); $('.skip', v).classList.remove('on'); runReveal(v); break; }
    case 'done': t.closest('.vault').remove(); setBackgroundInert(false); S.scene = 'done'; save(); renderFinished(); break;
    case 'replayfull': S.scene = 'reveal'; save(); renderReveal(); break;
    case 'restart': { const done = S.done || []; S = fresh(); S.done = done; save(); render(); break; }
  }
});

// The Cut's keep toggles.
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]'); if (!t) return;
  const id = +t.dataset.toggle;
  if (S.keep.includes(id)) S.keep = S.keep.filter(x => x !== id);
  else if (S.keep.length < 10) S.keep.push(id);
  save(); renderCut();
});

// For the Playwright harness. A getter, not a snapshot — S is reassigned on
// restart and on entering a new topic, and a stale copy would make the tests
// assert against a state the app has already left.
Object.defineProperty(window, 'S', { get: () => S });
window.byId = byId; window.PEOPLE = PEOPLE;
window.theirTen = theirTen; window.listName = listName;
window.topicTitle = topicTitle; window.topicPrompt = topicPrompt; window.makeTopic = makeTopic;
window.supply = supply; window.offerable = offerable; window.inTopic = inTopic; window.KEY = KEY;
window.rabbitHole = rabbitHole; window.CAT = CAT; window.renderBuild = renderBuild;
render();
</script>
</body>
</html>
